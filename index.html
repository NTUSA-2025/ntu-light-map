<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>台大夜間亮度地圖</title>
  <link rel="icon" href="favicon.ico" sizes="any" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #f27652;
      --accent-strong: #ff9b78;
      --accent-soft: rgba(242, 118, 82, 0.14);
      --bg-shell: #070e1b;
      --bg-panel: #0b1728;
      --surface: rgba(20, 35, 58, 0.84);
      --surface-raised: rgba(25, 43, 70, 0.92);
      --surface-overlay: #1b2c47;
      --border: rgba(184, 204, 232, 0.12);
      --border-strong: rgba(184, 204, 232, 0.2);
      --text-hi: #f3f6fb;
      --text-mid: #a7b5c9;
      --text-lo: #6f819a;
      --success: #7bd8ac;
      --warning: #f2c77d;
      --dock-w: 68px;
      --panel-w: 320px;
      --shadow-panel: 0 24px 60px rgba(0, 0, 0, 0.26);
      color-scheme: dark;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: var(--bg-shell);
      color: var(--text-hi);
      font-family: 'DM Sans', 'Noto Sans TC', ui-sans-serif, system-ui, sans-serif;
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea { font: inherit; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--accent-strong);
      outline-offset: 2px;
    }

    #shell {
      position: relative;
      display: flex;
      width: 100%;
      height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg-shell);
    }

    #dock {
      width: var(--dock-w);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding: 18px 10px;
      background:
        linear-gradient(180deg, rgba(21, 42, 68, 0.56), transparent 42%),
        var(--bg-panel);
      border-right: 1px solid var(--border);
      box-shadow: 8px 0 28px rgba(0, 0, 0, 0.1);
      z-index: 900;
    }

    .dock-logo {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      margin-bottom: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 13px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
    }

    .dock-logo img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .dock-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border: 1px solid transparent;
      border-radius: 15px;
      background: transparent;
      color: var(--text-mid);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--border);
      color: var(--text-hi);
      transform: translateY(-1px);
    }

    .dock-btn.active {
      background: linear-gradient(145deg, rgba(242, 118, 82, 0.24), rgba(242, 118, 82, 0.08));
      border-color: rgba(242, 118, 82, 0.28);
      color: var(--accent-strong);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .dock-btn:disabled {
      color: var(--text-lo);
      cursor: not-allowed;
      opacity: 0.45;
    }

    .dock-btn:disabled:hover {
      background: transparent;
      border-color: transparent;
      color: var(--text-lo);
      transform: none;
    }

    .dock-btn.hidden { display: none; }

    .dock-tip {
      position: absolute;
      top: 50%;
      left: calc(100% + 12px);
      z-index: 9999;
      padding: 7px 10px;
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      background: var(--surface-overlay);
      color: var(--text-hi);
      font-size: 11px;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-50%) translateX(-4px);
      transition: opacity 0.16s, transform 0.16s;
    }

    .dock-btn:hover .dock-tip {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }

    .dock-div {
      width: 28px;
      height: 1px;
      margin: 8px 0;
      background: var(--border);
    }

    .dock-spacer { flex: 1; }

    #panel {
      position: relative;
      display: flex;
      width: var(--panel-w);
      min-width: 0;
      flex-basis: var(--panel-w);
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 0 0, rgba(75, 123, 181, 0.16), transparent 34%),
        linear-gradient(180deg, rgba(15, 31, 52, 0.98), rgba(8, 20, 36, 0.98));
      border-right: 1px solid var(--border);
      box-shadow: var(--shadow-panel);
      transition: width 0.28s cubic-bezier(.4, 0, .2, 1);
      z-index: 700;
    }

    #panel.closed {
      flex-basis: 0;
      width: 0;
      border-right-width: 0;
      border-right-color: transparent;
      box-shadow: none;
    }

    .panel-head {
      position: relative;
      flex-shrink: 0;
      padding: 24px 22px 20px;
      border-bottom: 1px solid var(--border);
    }

    .panel-head-title {
      margin-bottom: 7px;
      color: var(--text-hi);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.3;
      white-space: nowrap;
    }

    .panel-head > .panel-head-title::before {
      display: block;
      margin-bottom: 9px;
      color: var(--accent-strong);
      content: 'LIVE CAMPUS MAP';
      font-family: 'DM Mono', monospace;
      font-size: 0.625rem;
      font-weight: 500;
      letter-spacing: 0.14em;
    }

    .panel-head-sub {
      color: var(--text-lo);
      font-family: 'DM Mono', monospace;
      font-size: 0.6875rem;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .panel-body {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .panel-body.hidden { display: none; }

    .panel-body::-webkit-scrollbar,
    .admin-screen-body::-webkit-scrollbar { width: 5px; }

    .panel-body::-webkit-scrollbar-track,
    .admin-screen-body::-webkit-scrollbar-track { background: transparent; }

    .panel-body::-webkit-scrollbar-thumb,
    .admin-screen-body::-webkit-scrollbar-thumb {
      border-radius: 99px;
      background: rgba(184, 204, 232, 0.16);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .stat-card,
    .block {
      border: 1px solid var(--border);
      background:
        linear-gradient(145deg, rgba(31, 53, 84, 0.72), rgba(16, 31, 52, 0.72)),
        var(--surface);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
    }

    .stat-card {
      position: relative;
      overflow: hidden;
      padding: 18px;
      border-radius: 18px;
    }

    .stat-card::after {
      position: absolute;
      right: -24px;
      bottom: -32px;
      width: 112px;
      height: 112px;
      border: 1px solid rgba(242, 118, 82, 0.22);
      border-radius: 50%;
      box-shadow: 0 0 0 14px rgba(242, 118, 82, 0.035), 0 0 0 29px rgba(242, 118, 82, 0.025);
      content: '';
    }

    .stat-label {
      position: relative;
      z-index: 1;
      margin-bottom: 13px;
      color: var(--text-mid);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stat-val {
      position: relative;
      z-index: 1;
      color: var(--text-hi);
      font-family: 'DM Mono', monospace;
      font-size: 2.35rem;
      font-weight: 500;
      letter-spacing: -0.08em;
      line-height: 1;
    }

    .stat-unit {
      margin-left: 7px;
      color: var(--accent-strong);
      font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0;
    }

    .block {
      padding: 16px 17px;
      border-radius: 17px;
    }

    .block-label {
      margin-bottom: 16px;
      color: var(--text-mid);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .bar-row:last-child { margin-bottom: 0; }

    .bar-name {
      width: 54px;
      flex-shrink: 0;
      color: var(--text-mid);
      font-size: 0.75rem;
      white-space: nowrap;
    }

    .bar-track {
      flex: 1;
      height: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      transition: width 0.4s ease;
    }

    .bar-num {
      width: 24px;
      color: var(--text-lo);
      font-family: 'DM Mono', monospace;
      font-size: 0.6875rem;
      text-align: right;
    }

    .lrow {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 11px;
    }

    .lrow:last-child { margin-bottom: 0; }

    .lswatch {
      width: 34px;
      height: 10px;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 99px;
    }

    .ltxt {
      color: var(--text-mid);
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
    }

    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
      padding: 5px 0;
    }

    .layer-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .layer-dot {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 3px;
    }

    .layer-name {
      overflow: hidden;
      color: var(--text-mid);
      font-size: 0.8125rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tog {
      position: relative;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
      border: 0;
      border-radius: 99px;
      background: var(--accent);
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .tog::after {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.22);
      content: '';
      transition: right 0.2s, left 0.2s;
    }

    .tog:hover { box-shadow: 0 0 0 4px var(--accent-soft); }
    .tog.off { background: rgba(184, 204, 232, 0.2); }
    .tog.off::after { right: auto; left: 3px; }

    .admin-status {
      min-width: 0;
      color: var(--text-lo);
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
    }

    .admin-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .admin-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .admin-input,
    .dlg-field select,
    .dlg-field textarea,
    .dlg-field input {
      width: 100%;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      outline: none;
      background: rgba(3, 10, 20, 0.42);
      color: var(--text-hi);
      font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
      font-size: 0.8125rem;
    }

    .admin-input {
      min-height: 44px;
      padding: 10px 12px;
    }

    .admin-input:focus,
    .dlg-field input:focus,
    .dlg-field select:focus,
    .dlg-field textarea:focus { border-color: rgba(242, 118, 82, 0.72); }

    .admin-item {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: rgba(20, 35, 58, 0.72);
    }

    .admin-item.hidden-incident {
      border-color: rgba(242, 118, 82, 0.28);
      background: rgba(242, 118, 82, 0.08);
      opacity: 0.84;
    }

    .admin-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .admin-item-title {
      min-width: 0;
      overflow: hidden;
      color: var(--text-hi);
      font-size: 0.8125rem;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .admin-badge {
      flex-shrink: 0;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-mid);
      font-family: 'DM Mono', monospace;
      font-size: 0.625rem;
    }

    .admin-badge.public { color: var(--success); }
    .admin-badge.hidden { color: var(--accent-strong); }
    .admin-badge.admin-role { color: #a9cafa; }

    .admin-desc {
      overflow-wrap: anywhere;
      color: var(--text-mid);
      font-size: 0.8125rem;
      line-height: 1.5;
    }

    .admin-meta {
      color: var(--text-lo);
      font-family: 'DM Mono', monospace;
      font-size: 0.625rem;
      line-height: 1.5;
    }

    .admin-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .admin-screen {
      position: absolute;
      inset: 0;
      z-index: 1200;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background:
        radial-gradient(circle at 80% 0, rgba(75, 123, 181, 0.16), transparent 34%),
        var(--bg-shell);
    }

    .admin-screen.hidden { display: none; }

    .admin-screen-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
      padding: 22px 28px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 23, 40, 0.88);
    }

    .admin-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-mid);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .admin-close:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-hi);
    }

    .admin-status-log {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .admin-screen-body {
      display: grid;
      flex: 1;
      min-height: 0;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 22px;
      padding: 24px 28px 28px;
      overflow-y: auto;
    }

    .admin-section {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 14px;
      padding-top: 2px;
    }

    .admin-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 46px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .admin-section-title {
      color: var(--text-hi);
      font-size: 0.9375rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .admin-section-sub {
      margin-top: 5px;
      color: var(--text-lo);
      font-family: 'DM Mono', monospace;
      font-size: 0.625rem;
      letter-spacing: 0.04em;
    }

    .admin-main .admin-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 12px;
    }

    .btn-pri,
    .btn-sec,
    .btn-danger,
    .btn-restore {
      min-height: 42px;
      padding: 9px 14px;
      border-radius: 11px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, opacity 0.2s;
    }

    .btn-pri {
      border: 1px solid transparent;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 20px rgba(242, 118, 82, 0.18);
    }

    .btn-pri:not(:disabled):hover { background: #ff8967; }

    .btn-sec {
      border: 1px solid var(--border-strong);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-mid);
    }

    .btn-sec:hover {
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-hi);
    }

    .btn-danger {
      border: 1px solid rgba(242, 118, 82, 0.36);
      background: rgba(242, 118, 82, 0.13);
      color: var(--accent-strong);
    }

    .btn-restore {
      border: 1px solid rgba(123, 216, 172, 0.34);
      background: rgba(123, 216, 172, 0.12);
      color: var(--success);
    }

    .btn-pri:disabled,
    .btn-danger:disabled,
    .btn-restore:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    #map-wrap {
      position: relative;
      z-index: 1;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      background: #09111e;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .leaflet-container { background: #09111e; }
    .leaflet-control { box-shadow: none !important; }
    .leaflet-bar { border: 0 !important; background: transparent !important; }

    .leaflet-bar a {
      width: 36px !important;
      height: 36px !important;
      border: 1px solid var(--border) !important;
      background: rgba(11, 23, 40, 0.88) !important;
      color: var(--text-hi) !important;
      font-size: 19px !important;
      line-height: 34px !important;
      transition: background 0.2s;
    }

    .leaflet-bar a:first-child { border-radius: 12px 12px 4px 4px; }
    .leaflet-bar a:last-child { border-radius: 4px 4px 12px 12px; }
    .leaflet-bar a:hover { background: rgba(31, 53, 84, 0.96) !important; }
    .leaflet-control-zoom { margin: 58px 18px 18px !important; }

    .leaflet-control-attribution {
      padding: 3px 7px !important;
      border: 1px solid rgba(184, 204, 232, 0.12);
      border-radius: 7px 0 0;
      background: rgba(7, 14, 27, 0.78) !important;
      color: var(--text-lo) !important;
      font-size: 9px !important;
      backdrop-filter: blur(8px);
    }

    .leaflet-control-attribution a { color: var(--text-mid) !important; }

    #topbar {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 22px;
      border-bottom: 1px solid rgba(184, 204, 232, 0.1);
      background: linear-gradient(180deg, rgba(7, 14, 27, 0.88), rgba(7, 14, 27, 0.44));
      pointer-events: none;
      backdrop-filter: blur(10px);
    }

    .topbar-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-hi);
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .topbar-dot {
      width: 8px;
      height: 8px;
      border: 2px solid rgba(242, 118, 82, 0.28);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(242, 118, 82, 0.1), 0 0 18px rgba(242, 118, 82, 0.6);
    }

    .topbar-meta {
      color: var(--text-lo);
      font-family: 'DM Mono', monospace;
      font-size: 0.625rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    #hex-tooltip {
      position: absolute;
      top: 78px;
      left: 50%;
      z-index: 1001;
      padding: 8px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      background: rgba(11, 23, 40, 0.92);
      color: var(--text-hi);
      font-family: 'DM Mono', monospace;
      font-size: 0.6875rem;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateX(-50%) translateY(-4px);
      transition: opacity 0.2s, transform 0.2s;
      backdrop-filter: blur(8px);
    }

    #hex-tooltip.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #inc-fab {
      position: absolute;
      bottom: 24px;
      left: 50%;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 19px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 99px;
      background: linear-gradient(135deg, #fa815e, var(--accent));
      color: #fff;
      font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(7, 14, 27, 0.35), 0 8px 20px rgba(242, 118, 82, 0.2);
      transform: translateX(-50%);
      transition: transform 0.2s, filter 0.2s;
    }

    #inc-fab:hover {
      filter: brightness(1.08);
      transform: translateX(-50%) translateY(-2px);
    }

    #inc-fab svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
    }

    #inc-dialog {
      position: absolute;
      bottom: 88px;
      left: 50%;
      z-index: 1100;
      display: none;
      width: min(390px, calc(100vw - 32px));
      overflow: hidden;
      border: 1px solid var(--border-strong);
      border-radius: 22px;
      background: rgba(11, 23, 40, 0.96);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.36);
      transform: translateX(-50%);
      backdrop-filter: blur(18px);
    }

    #inc-dialog.show { display: block; }

    .dlg-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .dlg-head-title {
      color: var(--text-hi);
      font-size: 0.875rem;
      font-weight: 600;
    }

    .dlg-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-mid);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
    }

    .dlg-close:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-hi);
    }

    .dlg-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px 18px 18px;
    }

    .dlg-status {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--text-mid);
      font-family: 'DM Mono', monospace;
      font-size: 0.6875rem;
      line-height: 1.45;
    }

    .dlg-status.ok { color: var(--success); }
    .dlg-status.err { color: var(--accent-strong); }

    .dlg-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .dlg-field label {
      color: var(--text-mid);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dlg-field select,
    .dlg-field textarea,
    .dlg-field input {
      min-height: 44px;
      padding: 10px 12px;
    }

    .dlg-field select option { background: var(--bg-panel); }
    .dlg-field textarea { min-height: 96px; resize: vertical; }

    .dlg-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
    }

    .inc-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .inc-section.hidden { display: none; }

    @media (max-width: 960px) {
      .admin-screen-head { padding-inline: 20px; }
      .admin-screen-body {
        grid-template-columns: 1fr;
        padding: 20px;
      }
    }

    @media (max-width: 760px) {
      #shell { display: block; }

      #map-wrap {
        position: absolute;
        inset: 0;
      }

      #dock {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 900;
        display: flex;
        width: 100%;
        height: calc(72px + env(safe-area-inset-bottom));
        min-height: 72px;
        flex-direction: row;
        justify-content: space-around;
        gap: 4px;
        padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--border);
        border-right: 0;
        background: rgba(8, 20, 36, 0.92);
        box-shadow: 0 -14px 30px rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(16px);
      }

      .dock-logo,
      .dock-div,
      .dock-spacer { display: none; }

      .dock-btn {
        width: auto;
        max-width: 96px;
        height: 54px;
        flex: 1;
        flex-direction: column;
        gap: 4px;
        border-radius: 16px;
        font-size: 18px;
      }

      .dock-tip {
        position: static;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--text-lo);
        font-size: 0.625rem;
        line-height: 1;
        opacity: 1;
        transform: none;
      }

      .dock-btn:hover .dock-tip,
      .dock-btn.active .dock-tip {
        color: currentColor;
        transform: none;
      }

      #panel {
        position: absolute;
        right: 12px;
        bottom: calc(82px + env(safe-area-inset-bottom));
        left: 12px;
        z-index: 700;
        width: auto;
        height: min(62dvh, 560px);
        max-height: calc(100dvh - 154px);
        border: 1px solid var(--border-strong);
        border-radius: 26px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
        transition: transform 0.28s cubic-bezier(.4, 0, .2, 1), opacity 0.2s;
      }

      #panel::before {
        position: absolute;
        top: 8px;
        left: 50%;
        z-index: 2;
        width: 38px;
        height: 4px;
        border-radius: 99px;
        background: rgba(184, 204, 232, 0.32);
        content: '';
        transform: translateX(-50%);
      }

      #panel.closed {
        width: auto;
        border-color: transparent;
        opacity: 0;
        pointer-events: none;
        transform: translateY(calc(100% + 32px));
      }

      .panel-head { padding: 22px 20px 17px; }
      .panel-head-title { font-size: 1rem; }
      .panel-body { padding: 15px 15px 22px; gap: 12px; }
      .stat-card { padding: 16px; }
      .block { padding: 15px 16px; }
      .layer-item { min-height: 48px; }
      .tog { width: 44px; height: 26px; }
      .tog::after { top: 3px; right: 3px; width: 20px; height: 20px; }
      .tog.off::after { left: 3px; }

      #topbar {
        height: calc(64px + env(safe-area-inset-top));
        padding: env(safe-area-inset-top) 16px 0;
      }

      .topbar-title { font-size: 0.8125rem; }
      .topbar-meta { font-size: 0.5625rem; }
      .leaflet-control-zoom { margin: 82px 14px 14px !important; }

      .leaflet-bar a {
        width: 44px !important;
        height: 44px !important;
        font-size: 21px !important;
        line-height: 42px !important;
      }

      #hex-tooltip { top: calc(76px + env(safe-area-inset-top)); }

      #inc-fab {
        right: 16px;
        bottom: calc(88px + env(safe-area-inset-bottom));
        left: auto;
        min-height: 48px;
        padding-inline: 16px;
        transform: none;
      }

      #inc-fab:hover { transform: translateY(-2px); }

      #inc-dialog {
        right: 12px;
        bottom: calc(82px + env(safe-area-inset-bottom));
        left: 12px;
        width: auto;
        max-height: calc(100dvh - 112px);
        overflow-y: auto;
        transform: none;
      }

      .admin-screen-head { padding: 18px 16px 15px; }
      .admin-screen-body { gap: 18px; padding: 16px; }
    }

    @media (max-width: 420px) {
      .topbar-meta { display: none; }
      #panel {
        right: 8px;
        left: 8px;
        height: min(67dvh, 560px);
      }
      #inc-fab { right: 12px; }
      .dlg-actions { flex-direction: column-reverse; }
      .dlg-actions > button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
<div id="shell">
  <nav id="dock" aria-label="主導覽">
    <div class="dock-logo" aria-hidden="true">
      <img src="logo.png" alt="" />
    </div>

    <button class="dock-btn active" id="btnPanel" type="button" aria-label="數據面板" aria-pressed="true">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/><rect x="14" y="17" width="7" height="4" rx="1"/>
      </svg>
      <span class="dock-tip">數據面板</span>
    </button>

    <div class="dock-div"></div>

    <button class="dock-btn" id="btnReport" type="button" aria-label="回報事件" aria-pressed="false">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span class="dock-tip">回報事件</span>
    </button>

    <div class="dock-spacer"></div>
    <div class="dock-div"></div>

    <button class="dock-btn hidden" id="btnAdmin" type="button" aria-label="後台管理" aria-pressed="false">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/>
        <path d="M2 6h4"/>
        <path d="M2 10h4"/>
        <path d="M2 14h4"/>
        <path d="M2 18h4"/>
        <path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/>
      </svg>
      <span class="dock-tip">後台管理</span>
    </button>

    <button class="dock-btn" type="button" aria-label="設定" aria-pressed="false">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      <span class="dock-tip">設定</span>
    </button>

    <button class="dock-btn" id="btnLogout" type="button" aria-label="登出" disabled>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span class="dock-tip">登出</span>
    </button>
  </nav>

  <aside id="panel" aria-label="數據面板">
    <div class="panel-head">
      <div class="panel-head-title" id="panel-title">台大校園夜間亮度地圖</div>
      <div class="panel-head-sub" id="panel-sub">NTU Nighttime Light Map</div>
    </div>
    <div class="panel-body" id="dashboard-panel">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">回報事件</div>
          <div class="stat-val" id="stat-incident-count">0<span class="stat-unit">件</span></div>
        </div>
      </div>

      <div class="block">
        <div class="block-label">事件類型分佈</div>
        <div class="bar-row">
          <span class="bar-name">夜間事故</span>
          <div class="bar-track"><div class="bar-fill" id="bar-accident" style="width:0%;background:#F0997B;"></div></div>
          <span class="bar-num" id="bar-accident-num">0</span>
        </div>
        <div class="bar-row">
          <span class="bar-name">夜間騷擾</span>
          <div class="bar-track"><div class="bar-fill" id="bar-harassment" style="width:0%;background:#ef718d;"></div></div>
          <span class="bar-num" id="bar-harassment-num">0</span>
        </div>
      </div>

      <div class="block">
        <div class="block-label">亮度圖例（lux）</div>
        <div class="lrow"><span class="lswatch" style="background:#0b1020;"></span><span class="ltxt">0 - 1</span></div>
        <div class="lrow"><span class="lswatch" style="background:#1f2a5a;"></span><span class="ltxt">1 - 12</span></div>
        <div class="lrow"><span class="lswatch" style="background:#2f6f9f;"></span><span class="ltxt">12 - 29</span></div>
        <div class="lrow"><span class="lswatch" style="background:#6fd0c2;"></span><span class="ltxt">29 - 54</span></div>
        <div class="lrow"><span class="lswatch" style="background:#f3f6ff;"></span><span class="ltxt">54 +</span></div>
      </div>

      <div class="block">
        <div class="block-label">圖層</div>
        <div class="layer-item">
          <div class="layer-left">
            <span class="layer-dot" style="background:#f3f6ff;"></span>
            <span class="layer-name">實測亮度</span>
          </div>
          <button class="tog" id="tog-brightness" type="button" aria-label="切換實測亮度圖層" aria-pressed="true"></button>
        </div>
        <div class="layer-item">
          <div class="layer-left">
            <span class="layer-dot" style="background:#7bcfa1;"></span>
            <span class="layer-name">道路安全框線</span>
          </div>
          <button class="tog" id="tog-safety" type="button" aria-label="切換道路安全圖層" aria-pressed="true"></button>
        </div>
        <div class="layer-item">
          <div class="layer-left">
            <span class="layer-dot" style="background:#D85A30;"></span>
            <span class="layer-name">安全事件</span>
          </div>
          <button class="tog" id="tog-incident" type="button" aria-label="切換安全事件圖層" aria-pressed="true"></button>
        </div>
        <div class="layer-item">
          <div class="layer-left">
            <span class="layer-dot" style="background:#b79af5;"></span>
            <span class="layer-name">光害控制區</span>
          </div>
          <button class="tog" id="tog-protect" type="button" aria-label="切換光害控制區圖層" aria-pressed="true"></button>
        </div>
      </div>
    </div>
  </aside>

  <div id="map-wrap">
    <div id="topbar" role="banner" aria-label="地圖標題">
      <div class="topbar-title">
        <span class="topbar-dot"></span>
        台大夜間亮度地圖
      </div>
      <div class="topbar-meta">NTU Campus</div>
    </div>

    <div id="hex-tooltip" role="status" aria-live="polite"></div>
    <div id="map"></div>

    <section class="admin-screen hidden" id="admin-panel" aria-label="事件後台">
      <header class="admin-screen-head">
        <div>
          <div class="panel-head-title">事件後台</div>
          <div class="panel-head-sub">Incident Admin</div>
        </div>
        <div class="admin-status-log" id="admin-status" aria-live="polite">尚未載入</div>
        <button class="admin-close" id="btn-admin-close" type="button" aria-label="關閉事件後台">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </header>
      <div class="admin-screen-body">
        <section class="admin-section">
          <div class="admin-section-head">
            <div>
              <div class="admin-section-title">管理員</div>
              <div class="admin-section-sub">Admin Users</div>
            </div>
          </div>
          <div class="block">
            <div class="block-label">新增管理員</div>
            <div class="admin-form">
              <input class="admin-input" id="admin-email" type="email" placeholder="name@ntu.edu.tw" autocomplete="off"/>
              <button class="btn-pri" id="btn-admin-add" type="button">新增管理員</button>
            </div>
          </div>
          <div class="admin-list" id="admin-users-list"></div>
        </section>
        <section class="admin-section admin-main">
          <div class="admin-section-head">
            <div>
              <div class="admin-section-title">事件管理</div>
              <div class="admin-section-sub">Incident Review</div>
            </div>
          </div>
          <div class="admin-list" id="admin-incidents-list"></div>
        </section>
      </div>
    </section>

    <button id="inc-fab" type="button" aria-label="回報安全事件">
      <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      回報安全事件
    </button>

    <div id="inc-dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <div class="dlg-head">
        <span class="dlg-head-title" id="dlg-title">新增安全事件</span>
        <button class="dlg-close" id="dlg-close" type="button" aria-label="關閉">×</button>
      </div>
      <div class="dlg-body">
        <div class="inc-section" id="auth-section">
          <div class="dlg-status" id="auth-status">請使用 NTU email 驗證後回報</div>
          <div class="dlg-field">
            <label for="auth-email">NTU Email</label>
            <input id="auth-email" type="email" placeholder="name@ntu.edu.tw" autocomplete="email"/>
          </div>
          <div class="dlg-actions">
            <button class="btn-pri" id="btn-request-code" type="button">寄送驗證碼</button>
          </div>
          <div class="dlg-field">
            <label for="auth-code">驗證碼</label>
            <input id="auth-code" inputmode="numeric" maxlength="6" placeholder="6 位數字" autocomplete="one-time-code"/>
          </div>
          <div class="dlg-actions">
            <button class="btn-pri" id="btn-verify-code" type="button">驗證</button>
          </div>
        </div>

        <div class="inc-section hidden" id="report-section">
          <div class="dlg-status" id="report-status">請在地圖上點選回報區</div>
          <div class="dlg-field">
            <label for="inc-type">事件類型</label>
            <select id="inc-type" required>
              <option value="accident">夜間事故</option>
              <option value="harassment">夜間騷擾</option>
            </select>
          </div>
          <div class="dlg-field">
            <label for="inc-desc">描述</label>
            <textarea id="inc-desc" maxlength="300" required placeholder="請描述事件情況..."></textarea>
          </div>
          <div class="dlg-actions">
            <button class="btn-sec" id="btn-cancel" type="button">取消</button>
            <button class="btn-pri" id="btn-submit" type="button" disabled>送出</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const map = L.map('map', { zoomControl: true }).setView([25.0173, 121.5398], 16);

map.createPane('brightnessPane'); map.getPane('brightnessPane').style.zIndex = 350;
map.createPane('safetyPane');     map.getPane('safetyPane').style.zIndex = 300;
map.createPane('protectPane');    map.getPane('protectPane').style.zIndex = 250;
map.createPane('incidentPane');   map.getPane('incidentPane').style.zIndex = 400;

const ASSET_BASE = location.pathname.startsWith('/ntu_light_map/') ? '/ntu_light_map' : '';
const assetUrl = path => `${ASSET_BASE}${path}`;

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OSM contributors &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 20
}).addTo(map);

const panel = document.getElementById('panel');
const btnPanel = document.getElementById('btnPanel');
const btnReport = document.getElementById('btnReport');
const btnLogout = document.getElementById('btnLogout');
const btnAdmin = document.getElementById('btnAdmin');
const panelTitle = document.getElementById('panel-title');
const panelSub = document.getElementById('panel-sub');
const dashboardPanel = document.getElementById('dashboard-panel');
const adminPanel = document.getElementById('admin-panel');
const adminStatus = document.getElementById('admin-status');
const adminUsersList = document.getElementById('admin-users-list');
const adminIncidentsList = document.getElementById('admin-incidents-list');
const adminEmail = document.getElementById('admin-email');
const btnAdminAdd = document.getElementById('btn-admin-add');
const btnAdminClose = document.getElementById('btn-admin-close');

function syncPanelButtonState(open) {
  btnPanel.classList.toggle('active', open);
  btnPanel.setAttribute('aria-pressed', String(open));
}

btnPanel.addEventListener('click', () => {
  if (!adminPanel.classList.contains('hidden')) {
    showDashboardPanel();
    return;
  }

  if (dashboardPanel.classList.contains('hidden')) {
    showDashboardPanel();
    return;
  }

  const closed = panel.classList.toggle('closed');
  syncPanelButtonState(!closed);
  window.setTimeout(() => map.invalidateSize(), 280);
});

const layerMap = {};

function makeToggle(id, layerKey) {
  const btn = document.getElementById(id);
  btn.addEventListener('click', () => {
    btn.classList.toggle('off');
    btn.setAttribute('aria-pressed', String(!btn.classList.contains('off')));
    const layer = layerMap[layerKey];
    if (!layer) return;
    if (btn.classList.contains('off')) map.removeLayer(layer);
    else layer.addTo(map);
  });
}

let allIncidents = [];

let allAdminUsers = [];

const reportSec = document.getElementById('report-section');

const reportStatus = document.getElementById('report-status');

function setStatus(el, message, state = '') {
  el.textContent = message;
  el.className = `dlg-status ${state}`.trim();
}

function setAuthSession(session) {
  authSession = session?.authenticated ? session : null;
  btnLogout.disabled = !authSession;
  setAdminButtonVisible(Boolean(authSession?.admin));
  if (!authSession?.admin && !adminPanel.classList.contains('hidden')) showDashboardPanel();
}

function setAdminStatus(message) {
  adminStatus.textContent = message;
}

function setAdminButtonVisible(visible) {
  btnAdmin.classList.toggle('hidden', !visible);
}

function showDashboardPanel() {
  panel.classList.remove('closed');
  dashboardPanel.classList.remove('hidden');
  adminPanel.classList.add('hidden');
  syncPanelButtonState(true);
  btnAdmin.classList.remove('active');
  btnAdmin.setAttribute('aria-pressed', 'false');
  panelTitle.textContent = '台大校園夜間亮度地圖';
  panelSub.textContent = 'NTU Nighttime Light Map';
  window.setTimeout(() => map.invalidateSize(), 280);
}

async function showAdminPanel() {

    setAuthSession(authSession);
    showDashboardPanel();
    return;
  }

  if (incDialog.classList.contains('show')) closeDialog();
  panel.classList.remove('closed');
  dashboardPanel.classList.remove('hidden');
  adminPanel.classList.remove('hidden');

  btnAdmin.setAttribute('aria-pressed', 'true');
  panelTitle.textContent = '台大校園夜間亮度地圖';
  panelSub.textContent = 'NTU Nighttime Light Map';

  authSec.classList.remove('hidden');
  reportSec.classList.add('hidden');
  if (reportHexLayer && map.hasLayer(reportHexLayer)) map.removeLayer(reportHexLayer);
}

function showReport() {
  authSec.classList.add('hidden');
  reportSec.classList.remove('hidden');
  if (reportHexLayer && !map.hasLayer(reportHexLayer)) reportHexLayer.addTo(map);
}

function closeDialog() {
  incDialog.classList.remove('show');
  btnReport.classList.remove('active');
  btnReport.setAttribute('aria-pressed', 'false');
  authSec.classList.remove('hidden');
  reportSec.classList.add('hidden');
  selectedHex = null;
  incDesc.value = '';
  authCode.value = '';
  btnSubmit.disabled = true;
  setStatus(reportStatus, '請在地圖上點選回報區');

  }

function updateSubmitState() {
  btnSubmit.disabled = !selectedHex || incDesc.value.trim().length === 0;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function incidentLabel(type) {
  return incidentTypeMeta[type]?.label || incidentTypeMeta.accident.label;
}

function incidentColor(type) {
  return incidentTypeMeta[type]?.color || incidentTypeMeta.accident.color;
}

function incidentStatusLabel(status) {
  return status === 'hidden' ? '已封存' : '公開';
}

function updateStatsPanel() {
  const total = allIncidents.length;
  const accidentCount = allIncidents.filter(incident => incident.type === 'accident').length;
  const harassmentCount = allIncidents.filter(incident => incident.type === 'harassment').length;
  const maxCount = Math.max(accidentCount, harassmentCount, 1);

  document.getElementById('stat-incident-count').innerHTML =
    `${total}<span class="stat-unit">件</span>`;
  document.getElementById('bar-accident').style.width =
    `${Math.round(accidentCount / maxCount * 100)}%`;
  document.getElementById('bar-accident-num').textContent = accidentCount;
  document.getElementById('bar-harassment').style.width =
    `${Math.round(harassmentCount / maxCount * 100)}%`;
  document.getElementById('bar-harassment-num').textContent = harassmentCount;
}

function renderAdminIncidentList() {
  if (allAdminIncidents.length === 0) {
    adminIncidentsList.innerHTML = '<div class="admin-status">目前沒有事件</div>';
    return;
  }

  adminIncidentsList.innerHTML = allAdminIncidents.map(incident => {
    const isHidden = incident.status === 'hidden';
    const nextStatus = isHidden ? 'public' : 'hidden';
    const actionLabel = isHidden ? '恢復' : '封存';
    const actionClass = isHidden ? 'btn-restore' : 'btn-danger';
    return `
      <article class="admin-item ${isHidden ? 'hidden-incident' : ''}" data-incident-id="${escapeHtml(incident.id)}">
        <div class="admin-item-head">
          <div class="admin-item-title">${escapeHtml(incidentLabel(incident.type))} · #${escapeHtml(incident.id)}</div>
          <span class="admin-badge ${escapeHtml(incident.status)}">${incidentStatusLabel(incident.status)}</span>
        </div>
        <div class="admin-desc">${escapeHtml(incident.description)}</div>
        <div class="admin-meta">區域 ${escapeHtml(incident.report_hex_id)} · ${escapeHtml(incident.created_at)}</div>
        <div class="admin-actions">
          <button class="${actionClass}" data-incident-status="${nextStatus}">${actionLabel}</button>
        </div>
      </article>
    `;
  }).join('');
}

function renderAdminUserList() {
  if (allAdminUsers.length === 0) {
    adminUsersList.innerHTML = '<div class="admin-status">目前沒有管理員</div>';
    return;
  }

  adminUsersList.innerHTML = allAdminUsers.map(user => `
    <article class="admin-item" data-admin-email="${escapeHtml(user.email)}">
      <div class="admin-item-head">
        <div class="admin-item-title">${escapeHtml(user.email)}</div>
        <span class="admin-badge admin-role">admin</span>
      </div>
      <div class="admin-meta">新增者 ${escapeHtml(user.created_by || '-')} · ${escapeHtml(user.created_at)}</div>
      <div class="admin-actions">
        <button class="btn-danger" data-delete-admin="${escapeHtml(user.email)}">刪除</button>
      </div>
    </article>
  `).join('');
}

function renderIncidents() {
  incidentHexLayer.clearLayers();
  const grouped = new Map();

  allIncidents.forEach(incident => {
    const key = Number(incident.report_hex_id);
    if (!Number.isInteger(key)) return;
    const list = grouped.get(key) || [];
    list.push(incident);
    grouped.set(key, list);
  });

  grouped.forEach((incidents, reportHexId) => {
    const feature = reportHexFeatureById.get(reportHexId);
    if (!feature) return;

    const latest = incidents[0];
    const color = incidentColor(latest.type);
    const rows = incidents.slice(0, 5).map(incident => `
      <div style="border-top:1px solid rgba(15,23,42,.12); padding-top:5px; margin-top:5px;">
        <b>${escapeHtml(incidentLabel(incident.type))}</b><br/>
        ${escapeHtml(incident.description)}<br/>
        <span style="color:#64748b;">${escapeHtml(incident.created_at)}</span>
      </div>
    `).join('');

    const layer = L.geoJSON(feature, {
      pane: 'incidentPane',
      style: {
        color,
        weight: 1.4,
        opacity: 0.95,
        fillColor: color,
        fillOpacity: Math.min(0.62, 0.28 + incidents.length * 0.08)
      }
    });

    layer.bindPopup(`
      <div style="font:12px/1.5 system-ui,sans-serif; min-width:180px;">
        <b>回報區 ${reportHexId}</b><br/>
        回報數：${incidents.length}
        ${rows}
      </div>
    `);
    incidentHexLayer.addLayer(layer);
  });

  updateStatsPanel();
}

function selectReportHex(feature, layer) {
  const id = Number(feature.properties?.id);
  if (!Number.isInteger(id)) return;

  selectedHex = { id, center: layer.getBounds().getCenter(), feature };
  if (selectedHexLayer) selectedHexLayer.remove();

  selectedHexLayer = L.geoJSON(feature, {
    pane: 'incidentPane',
    interactive: false,
    style: {
      color: '#F0997B',
      weight: 2.5,
      opacity: 1,
      fillColor: '#D85A30',
      fillOpacity: 0.35
    }
  }).addTo(map);

  setStatus(reportStatus, `已選回報區 ${id}`, 'ok');
  updateSubmitState();
}

async function loadJSON(url) {
  const response = await fetch(url);
  return response.json();
}

async function loadIncidents() {
  const response = await fetch('/api/incidents', { headers: { accept: 'application/json' } });
  if (!response.ok) return;
  const data = await response.json();
  allIncidents = Array.isArray(data.incidents) ? data.incidents : [];
  renderIncidents();
}

async function loadAdminData() {
  setAdminStatus('載入中');

  try {
    const [incidentsResponse, usersResponse] = await Promise.all([
      fetch('/api/admin/incidents', { headers: { accept: 'application/json' } }),
      fetch('/api/admin/users', { headers: { accept: 'application/json' } })
    ]);

    if (
      incidentsResponse.status === 401 ||
      incidentsResponse.status === 403 ||
      usersResponse.status === 401 ||
      usersResponse.status === 403
    ) {
      setAuthSession(null);
      showDashboardPanel();
      return;
    }
    if (!incidentsResponse.ok || !usersResponse.ok) {
      setAdminStatus('載入失敗');
      return;
    }

    const incidentsData = await incidentsResponse.json();
    const usersData = await usersResponse.json();
    allAdminIncidents = Array.isArray(incidentsData.incidents) ? incidentsData.incidents : [];
    allAdminUsers = Array.isArray(usersData.admins) ? usersData.admins : [];
    renderAdminIncidentList();
    renderAdminUserList();
    setAdminStatus('載入完成');
  } catch {
    setAdminStatus('載入失敗');
  }
}

async function createAdminUser() {
  const email = adminEmail.value.trim().toLowerCase();
  if (!email.endsWith('@ntu.edu.tw')) {
    setAdminStatus('請輸入 @ntu.edu.tw email');
    return;
  }

  btnAdminAdd.disabled = true;
  setAdminStatus('新增管理員中');

  try {
    const response = await fetch('/api/admin/users', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        accept: 'application/json'
      },
      body: JSON.stringify({ email })
    });

    if (response.status === 401 || response.status === 403) {
      setAuthSession(null);
      showDashboardPanel();
      return;
    }
    if (!response.ok) {
      setAdminStatus('新增管理員失敗');
      return;
    }

    const data = await response.json();
    allAdminUsers = [
      data.admin,
      ...allAdminUsers.filter(user => user.email !== data.admin.email)
    ];
    adminEmail.value = '';
    renderAdminUserList();
    setAdminStatus('管理員已新增');
  } catch {
    setAdminStatus('新增管理員失敗');
  } finally {
    btnAdminAdd.disabled = false;
  }
}

async function loadReportHexes() {
  const geo = await loadJSON(assetUrl('/data/report_hex_4326.geojson'));
  geo.features.forEach(feature => {
    const id = Number(feature.properties?.id);
    if (Number.isInteger(id)) reportHexFeatureById.set(id, feature);
  });

  reportHexLayer = L.geoJSON(geo, {
    pane: 'incidentPane',
    style: {
      color: '#cbd5e1',
      weight: 0.55,
      opacity: 0.28,
      fillColor: '#cbd5e1',
      fillOpacity: 0.01
    },
    onEachFeature: (feature, layer) => {
      layer.on('click', () => selectReportHex(feature, layer));
      layer.on('mouseover', () => layer.setStyle({ opacity: 0.7, fillOpacity: 0.08, weight: 1 }));
      layer.on('mouseout', () => layer.setStyle({ opacity: 0.28, fillOpacity: 0.01, weight: 0.55 }));
    }
  });

  if (
    incDialog.classList.contains('show') &&
    !reportSec.classList.contains('hidden') &&
    !map.hasLayer(reportHexLayer)
  ) {
    reportHexLayer.addTo(map);
  }

  await loadIncidents();
}

async function getAuthSession() {
  try {
    const response = await fetch('/api/protected/session', {
      headers: { accept: 'application/json' }
    });
    if (!response.ok) return null;
    return response.json();
  } catch {
    return null;
  }
}

async function refreshAuthSession() {
  setAuthSession(await getAuthSession());
}

async function beginIncidentFlow() {
  if (!adminPanel.classList.contains('hidden')) showDashboardPanel();
  if (window.matchMedia('(max-width: 760px)').matches) {
    panel.classList.add('closed');
    syncPanelButtonState(false);
    window.setTimeout(() => map.invalidateSize(), 280);
  }

  if (incDialog.classList.contains('show')) {
    closeDialog();
    return;
  }
  if (!authSession) await refreshAuthSession();
  incDialog.classList.add('show');
  btnReport.classList.add('active');
  if (authSession?.authenticated) showReport();
  else showAuth();
}

    const response = await fetch('/api/auth/logout', {
      method: 'POST',

  }

btnRequestCode.addEventListener('click', async () => {

    setStatus(authStatus, '請輸入 @ntu.edu.tw email', 'err');

btnVerifyCode.addEventListener('click', async () => {

  }

        'content-type': 'application/json',
        accept: 'application/json'
      },

    });

adminIncidentsList.addEventListener('click', async event => {
  const button = event.target.closest('[data-incident-status]');
  if (!button) return;

  const item = button.closest('[data-incident-id]');
  const id = Number(item?.dataset.incidentId);
  const nextStatus = button.dataset.incidentStatus;
  if (!Number.isInteger(id)) return;
  if (nextStatus !== 'public' && nextStatus !== 'hidden') return;

  const isRestoring = nextStatus === 'public';
  const actionLabel = isRestoring ? '恢復' : '封存';

  button.disabled = true;
  setAdminStatus(`${actionLabel}中`);

  try {
    const response = await fetch(`/api/admin/incidents/${id}`, {
      method: 'PATCH',
      headers: {
        'content-type': 'application/json',
        accept: 'application/json'
      },
      body: JSON.stringify({ status: nextStatus })
    });

    if (response.status === 401 || response.status === 403) {
      setAuthSession(null);
      showDashboardPanel();
      return;
    }
    if (!response.ok) {
      setAdminStatus(`${actionLabel}失敗`);
      button.disabled = false;
      return;
    }

    const data = await response.json();
    allAdminIncidents = allAdminIncidents.map(incident =>
      Number(incident.id) === id ? data.incident : incident
    );
    if (isRestoring) {
      allIncidents = [
        data.incident,
        ...allIncidents.filter(incident => Number(incident.id) !== id)
      ].sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
    } else {
      allIncidents = allIncidents.filter(incident => Number(incident.id) !== id);
    }
    renderAdminIncidentList();
    renderIncidents();
    setAdminStatus(`${actionLabel}完成`);
  } catch {
    setAdminStatus(`${actionLabel}失敗`);
    button.disabled = false;
  }
});

adminUsersList.addEventListener('click', async event => {
  const button = event.target.closest('[data-delete-admin]');
  if (!button) return;

  const email = button.dataset.deleteAdmin;
  if (!email) return;
  if (!window.confirm(`確定刪除管理員 ${email}？`)) return;

  button.disabled = true;
  setAdminStatus('刪除管理員中');

  try {
    const response = await fetch(`/api/admin/users/${encodeURIComponent(email)}`, {
      method: 'DELETE',
      headers: { accept: 'application/json' }
    });

    if (response.status === 401 || response.status === 403) {
      setAuthSession(null);
      showDashboardPanel();
      return;
    }
    if (response.status === 409) {
      setAdminStatus('不能刪除最後一位管理員');
      button.disabled = false;
      return;
    }
    if (!response.ok) {
      setAdminStatus('刪除管理員失敗');
      button.disabled = false;
      return;
    }

    allAdminUsers = allAdminUsers.filter(user => user.email !== email);
    renderAdminUserList();
    setAdminStatus('管理員已刪除');
  } catch {
    setAdminStatus('刪除管理員失敗');
    button.disabled = false;
  }
});

btnSubmit.addEventListener('click', async () => {
  if (reportSec.classList.contains('hidden')) return;
  if (!selectedHex) {
    setStatus(reportStatus, '請先點選回報區', 'err');
    return;
  }

  btnSubmit.disabled = true;
  setStatus(reportStatus, '送出中');

  try {
    const response = await fetch('/api/protected/incidents', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        accept: 'application/json'
      },
      body: JSON.stringify({
        report_hex_id: selectedHex.id,
        lat: selectedHex.center.lat,
        lng: selectedHex.center.lng,
        type: incType.value,
        description: incDesc.value.trim()
      })
    });

    if (response.status === 401 || response.status === 403) {
      setAuthSession(null);
      showAuth();
      setStatus(authStatus, '請先完成 NTU email 驗證', 'err');
      return;
    }
    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      setStatus(reportStatus, errorData.message || errorData.error || '送出失敗', 'err');
      updateSubmitState();
      return;
    }

    const data = await response.json();
    if (data.incident) {
      allIncidents.unshift(data.incident);
      renderIncidents();
    }
    closeDialog();
  } catch {
    setStatus(reportStatus, '送出失敗', 'err');
    updateSubmitState();
  }
});

(async () => {

    .map(feature => Number(feature.properties?.brightness_filled))

  const ramp = ['#0b1020', '#1f2a5a', '#2f6f9f', '#6fd0c2', '#f3f6ff'];
  const getColor = value => !Number.isFinite(value)
    ? '#7b8492'
    : value <= 1 ? ramp[0]
    : value <= 12 ? ramp[1]
    : value <= 29 ? ramp[2]
    : value <= 54 ? ramp[3]
    : ramp[4];

  const brightLayer = L.geoJSON(geoBrightness, {
    pane: 'brightnessPane',
    style: feature => ({
      color: 'rgba(6,10,18,.55)',
      weight: 0.25,
      fillColor: getColor(Number(feature.properties?.brightness_filled)),
      fillOpacity: 0.9
    }),
    onEachFeature: (feature, layer) => {
      const value = Number(feature.properties?.brightness_filled);
      const id = feature.properties?.id ?? '-';
      layer.on('mouseover', () => {
        hexTooltip.textContent = `Hex ${id}  ·  ${Number.isFinite(value) ? value.toFixed(2) : 'N/A'} lux`;
        hexTooltip.classList.add('show');
      });
      layer.on('mouseout', () => hexTooltip.classList.remove('show'));
      layer.bindPopup(`<div style="font:12px/1.5 system-ui;min-width:120px;"><b style="font-size:13px">Hex ${escapeHtml(String(id))}</b><br><span style="background:#f1f5fb;padding:3px 6px;border-radius:5px;display:inline-block;margin-top:4px;">${Number.isFinite(value) ? value.toFixed(2) : 'N/A'} lux</span></div>`);
    }
  }).addTo(map);
  layerMap.brightness = brightLayer;

  const geoSafety = await loadJSON(assetUrl('/data/hex_hit_with_safe.geojson'));
  const safeColor = score => score === 1 ? '#7bcfa1' : score === 2 ? '#e6c07a' : score === 3 ? '#e08a8a' : '#8aa2d6';
  const safetyLayer = L.geoJSON(geoSafety, {
    pane: 'safetyPane',
    style: feature => ({
      color: safeColor(Number(feature.properties?.safe_worst)),
      weight: 1.05,
      opacity: 0.9,
      fillOpacity: 0,
      fill: false
    }),
    onEachFeature: (feature, layer) => {
      const id = feature.properties?.id ?? '-';
      layer.bindPopup(`<div style="font:12px/1.5 system-ui;"><b>Hex ${escapeHtml(String(id))}</b><br>safe_worst: ${feature.properties?.safe_worst}<br>safe_mean: ${feature.properties?.safe_mean != null ? Number(feature.properties.safe_mean).toFixed(2) : 'N/A'}</div>`);
    }
  }).addTo(map);
  layerMap.safety = safetyLayer;

  const geoProtect = await loadJSON(assetUrl('/data/protect_square_4326.geojson'));
  const protectLayer = L.geoJSON(geoProtect, {
    pane: 'protectPane',
    style: { color: '#b79af5', fillColor: '#b79af5', fillOpacity: 0.18, weight: 0 }
  }).addTo(map);
  layerMap.protect = protectLayer;

  await loadReportHexes();

  if (window.location.hash === '#new-incident') {
    history.replaceState(null, '', location.pathname + location.search);
    beginIncidentFlow();
  }
})();
</script>
</body>
</html>
