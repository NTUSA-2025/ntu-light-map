<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>台大夜間亮度地圖</title>
  <link rel="icon" href="favicon.ico" sizes="any" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #e7e8e5;
      --ink-dim: #a4aaa7;
      --ink-faint: #68716e;
      --night: #070a0d;
      --night-soft: rgba(7, 10, 13, 0.82);
      --line: rgba(216, 226, 221, 0.18);
      --line-strong: rgba(216, 226, 221, 0.38);
      --cyan: #9ce7d8;
      --orange: #f0997b;
      --green: #7bcfa1;
      --violet: #b79af5;
      --danger: #f4a5a5;
      --success: #8ee0bd;
      --font: 'DM Sans', 'Noto Sans TC', ui-sans-serif, system-ui, sans-serif;
      --mono: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      color-scheme: dark;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--ink);
      font-family: var(--font);
    }

    button,
    input,
    select,
    textarea { font: inherit; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 1px solid var(--cyan);
      outline-offset: 4px;
    }

    #shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--night);
    }

    #map-wrap {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      background: #05080a;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    #map-wrap::before {
      position: absolute;
      inset: 0;
      z-index: 500;
      background:
        linear-gradient(90deg, rgba(3, 6, 8, 0.18), transparent 26%, transparent 72%, rgba(3, 6, 8, 0.22)),
        linear-gradient(0deg, rgba(3, 6, 8, 0.22), transparent 28%, transparent 72%, rgba(3, 6, 8, 0.18));
      content: '';
      pointer-events: none;
    }

    #dock {
      position: fixed;
      top: 27px;
      right: 30px;
      z-index: 10002;
      display: flex;
      align-items: center;
    }

    #dock .dock-logo,
    #dock .dock-div,
    #dock .dock-spacer,
    #dock #btnReport,
    #dock button[aria-label="設定"] { display: none; }

    #dock .dock-btn {
      display: none;
      min-height: 28px;
      align-items: center;
      gap: 9px;
      padding: 0 0 7px;
      border: 0;
      border-bottom: 1px solid var(--cyan);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      transition: color 0.2s, border-color 0.2s;
    }

    #dock #btnPanel:not(.active),
    #dock #btnAdmin:not(.hidden),
    #dock #btnLogout:not(:disabled) { display: inline-flex; }

    #dock #btnPanel.active { display: none; }

    #dock .dock-btn:hover {
      border-color: var(--ink);
      color: var(--cyan);
    }

    #dock .dock-btn.active { color: var(--cyan); }

    #dock .dock-btn svg {
      width: 15px;
      height: 15px;
    }

    #dock .dock-tip {
      position: static;
      padding: 0;
      border: 0;
      background: transparent;
      color: currentColor;
      font-size: inherit;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      opacity: 1;
      transform: none;
    }

    #dock #btnAdmin .dock-tip,
    #dock #btnLogout .dock-tip { display: none; }

    #panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 10000;
      display: flex;
      width: min(360px, 32vw);
      min-width: 300px;
      max-height: none;
      flex-direction: column;
      overflow: hidden;
      border: 0;
      border-left: 1px solid var(--line);
      border-radius: 0;
      background: linear-gradient(90deg, rgba(7, 10, 13, 0.72), rgba(7, 10, 13, 0.94) 16%);
      box-shadow: -28px 0 60px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    #panel.closed {
      opacity: 0;
      pointer-events: none;
      transform: translateX(calc(100% + 24px));
    }

    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      flex-shrink: 0;
      padding: 29px 28px 21px;
      border-bottom: 1px solid var(--line);
      background: transparent;
    }

    .panel-head-copy { min-width: 0; }

    .panel-head-title {
      overflow: hidden;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.015em;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #panel .panel-head-title::before { display: none; }


    .panel-close,
    .admin-close,
    .dlg-close {
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--ink-dim);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .panel-close {
      min-width: 40px;
      min-height: 26px;
      padding: 0 0 6px;
      border-bottom: 1px solid var(--line-strong);
      font-family: var(--mono);
      font-size: 0.5625rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .panel-close:hover,
    .admin-close:hover,
    .dlg-close:hover { color: var(--cyan); }

    .panel-body {
      display: flex;
      min-height: 0;
      flex-direction: column;
      gap: 0;
      padding: 0 28px 34px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .panel-body.hidden { display: none; }

    .panel-insights,
    .block,
    .layer-group {
      overflow: visible;
      border: 0;
      border-top: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
    }

    .panel-insights-title,
    .layer-group-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      padding: 0;
      color: var(--ink);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }

    .panel-insights-title::-webkit-details-marker,
    .layer-group-title::-webkit-details-marker { display: none; }

    .panel-insights-chevron,
    .layer-group-chevron {
      color: var(--ink-faint);
      font-size: 0.875rem;
      line-height: 1;
      transition: transform 0.2s ease, color 0.2s;
    }

    details[open] .panel-insights-chevron,
    details[open] .layer-group-chevron {
      color: var(--cyan);
      transform: rotate(180deg);
    }

    .panel-insights-content {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 0 0 19px;
    }

    .panel-body::-webkit-scrollbar,
    .admin-screen-body::-webkit-scrollbar { width: 4px; }

    .panel-body::-webkit-scrollbar-track,
    .admin-screen-body::-webkit-scrollbar-track { background: transparent; }

    .panel-body::-webkit-scrollbar-thumb,
    .admin-screen-body::-webkit-scrollbar-thumb {
      border-radius: 0;
      background: var(--line);
    }

    .stat-grid { display: grid; gap: 0; }

    .stat-card {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0 0 15px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
    }

    .stat-label,
    .block-label {
      margin: 0;
      color: var(--ink-faint);
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .stat-val {
      color: var(--ink);
      font-family: var(--mono);
      font-size: 1.7rem;
      font-weight: 400;
      line-height: 1;
    }

    .stat-unit {
      margin-left: 5px;
      color: var(--cyan);
      font-family: var(--font);
      font-size: 0.6875rem;
      font-weight: 600;
    }

    .panel-insights-content > .block {
      border-top: 0;
    }

    .block { padding: 18px 0; }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 13px;
    }

    .bar-row:first-of-type { margin-top: 15px; }

    .bar-name {
      width: 55px;
      flex-shrink: 0;
      color: var(--ink-dim);
      font-size: 0.6875rem;
      white-space: nowrap;
    }

    .bar-track {
      height: 2px;
      flex: 1;
      overflow: hidden;
      background: rgba(216, 226, 221, 0.13);
    }

    .bar-fill {
      height: 100%;
      transition: width 0.35s ease;
    }

    .bar-num {
      width: 20px;
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 0.625rem;
      text-align: right;
    }

    .layer-block {
      padding: 0;
      border-top: 0;
    }


    .layer-group-title {
      min-height: 45px;
      border-bottom: 1px solid var(--line);
    }

    .layer-group-content {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 0;
    }

    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 43px;
      padding: 0;
      border-bottom: 1px solid rgba(216, 226, 221, 0.1);
      border-radius: 0;
      transition: color 0.15s ease;
    }

    .layer-item:hover { background: transparent; }
    .layer-item:hover .layer-name { color: var(--cyan); }

    .layer-left {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
    }

    .layer-dot,
    .map-legend-swatch {
      width: 9px;
      height: 9px;
      flex-shrink: 0;
      border: 0;
      border-radius: 0;
    }

    .layer-name {
      overflow: hidden;
      color: var(--ink-dim);
      font-size: 0.75rem;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.15s;
    }

    .tog {
      position: relative;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border: 1px solid var(--line-strong);
      border-radius: 0;
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .tog::after {
      position: absolute;
      top: 2px;
      left: 5px;
      width: 4px;
      height: 8px;
      border-right: 1px solid var(--night);
      border-bottom: 1px solid var(--night);
      content: '';
      transform: rotate(45deg);
    }

    .tog:hover { border-color: var(--cyan); }
    .tog.off { border-color: var(--line-strong); background: transparent; }
    .tog.off::after { display: none; }
    .tog:not(.off) { border-color: var(--cyan); background: var(--cyan); }

    #map-legend {
      position: absolute;
      right: 29px;
      bottom: 28px;
      z-index: 1000;
      width: 150px;
      padding: 0 0 0 14px;
      border: 0;
      border-left: 1px solid var(--line-strong);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font-size: 0.6875rem;
      line-height: 1.35;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    #map-legend.hidden { display: none; }

    .map-legend-title {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 11px;
      color: var(--ink);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .map-legend-unit {
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 0.5625rem;
      font-weight: 400;
      letter-spacing: 0;
    }

    .map-legend-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 7px 0;
      color: var(--ink-dim);
      font-family: var(--mono);
      font-size: 0.625rem;
    }

    .map-legend-swatch {
      width: 20px;
      height: 5px;
    }

    .admin-status {
      min-width: 0;
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 0.6875rem;
    }

    .admin-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .admin-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .admin-input,
    .dlg-field select,
    .dlg-field textarea,
    .dlg-field input {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line-strong);
      border-radius: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font-family: var(--font);
      font-size: 0.8125rem;
    }

    .admin-input {
      min-height: 38px;
      padding: 8px 0;
    }

    .admin-input:focus,
    .dlg-field input:focus,
    .dlg-field select:focus,
    .dlg-field textarea:focus {
      border-color: var(--cyan);
    }

    .admin-item {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 14px 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
    }

    .admin-item.hidden-incident {
      border-color: rgba(244, 165, 165, 0.32);
      background: transparent;
      opacity: 0.84;
    }

    .admin-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .admin-item-title {
      min-width: 0;
      overflow: hidden;
      color: var(--ink);
      font-size: 0.75rem;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .admin-badge {
      flex-shrink: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 0.5625rem;
    }

    .admin-badge.public { color: var(--success); }
    .admin-badge.hidden { color: var(--danger); }
    .admin-badge.admin-role { color: var(--cyan); }

    .admin-desc {
      overflow-wrap: anywhere;
      color: var(--ink-dim);
      font-size: 0.75rem;
      line-height: 1.45;
    }

    .admin-meta {
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 0.5625rem;
      line-height: 1.45;
    }

    .admin-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .admin-screen {
      position: absolute;
      inset: 0;
      z-index: 12000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #080b0e;
    }

    .admin-screen.hidden { display: none; }

    .admin-screen-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
      padding: 24px 28px 18px;
      border-bottom: 1px solid var(--line);
      background: transparent;
    }

    .admin-screen-head .panel-head-title { font-size: 1rem; }

    .admin-screen-head .panel-head-sub {
      display: block;
      margin-top: 7px;
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 0.5625rem;
      letter-spacing: 0.14em;
    }

    .admin-close {
      display: inline-flex;
      width: 32px;
      height: 32px;
      align-items: center;
      justify-content: center;
    }

    .admin-status-log {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .admin-screen-body {
      display: grid;
      flex: 1;
      min-height: 0;
      grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
      gap: 40px;
      padding: 24px 28px 32px;
      overflow-y: auto;
    }

    .admin-section {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 10px;
    }

    .admin-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 40px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .admin-section-title {
      color: var(--ink);
      font-size: 0.8125rem;
      font-weight: 600;
    }

    .admin-section-sub {
      margin-top: 5px;
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 0.5625rem;
      letter-spacing: 0.1em;
    }

    .admin-main .admin-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 0 24px;
    }

    .btn-pri,
    .btn-sec,
    .btn-danger,
    .btn-restore {
      min-height: 35px;
      padding: 7px 12px;
      border-radius: 2px;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s, opacity 0.2s;
    }

    .btn-pri {
      border: 1px solid var(--cyan);
      background: var(--cyan);
      color: #071112;
    }

    .btn-pri:not(:disabled):hover { background: var(--ink); }

    .btn-sec {
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--ink-dim);
    }

    .btn-sec:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .btn-danger {
      border: 1px solid rgba(244, 165, 165, 0.38);
      background: transparent;
      color: var(--danger);
    }

    .btn-restore {
      border: 1px solid rgba(142, 224, 189, 0.38);
      background: transparent;
      color: var(--success);
    }

    .btn-pri:disabled,
    .btn-danger:disabled,
    .btn-restore:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .leaflet-container {
      background: #05080a;
      font-family: var(--font);
    }

    .leaflet-tile-pane {
      filter: invert(0.9) hue-rotate(180deg) saturate(0.46) brightness(0.69) contrast(1.1);
    }

    .leaflet-control { box-shadow: none !important; }
    .leaflet-bar { border: 0 !important; background: transparent !important; }

    .leaflet-bar a {
      width: 34px !important;
      height: 34px !important;
      border: 0 !important;
      border-bottom: 1px solid var(--line) !important;
      border-radius: 0 !important;
      background: rgba(7, 10, 13, 0.7) !important;
      color: var(--ink) !important;
      font-size: 18px !important;
      line-height: 32px !important;
    }

    .leaflet-bar a:hover {
      background: rgba(7, 10, 13, 0.9) !important;
      color: var(--cyan) !important;
    }

    .leaflet-control-zoom { margin: 72px 28px 28px !important; }

    .leaflet-control-attribution {
      padding: 3px 7px !important;
      border: 0;
      border-radius: 0;
      background: rgba(7, 10, 13, 0.62) !important;
      color: var(--ink-faint) !important;
      font-size: 9px !important;
      backdrop-filter: blur(8px);
    }

    .leaflet-control-attribution a { color: var(--ink-dim) !important; }

    #topbar {
      position: absolute;
      top: 27px;
      left: 30px;
      z-index: 1000;
      display: flex;
      width: min(320px, calc(100vw - 60px));
      flex-direction: column;
      gap: 8px;
      padding-left: 15px;
      border-left: 2px solid var(--cyan);
      pointer-events: none;
    }


    .topbar-title {
      display: block;
      color: var(--ink);
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.015em;
      line-height: 1.15;
    }

    .topbar-dot { display: none; }


    #hex-tooltip {
      position: absolute;
      top: 27px;
      left: 50%;
      z-index: 1001;
      padding: 7px 10px;
      border: 0;
      border-bottom: 1px solid var(--cyan);
      border-radius: 0;
      background: rgba(7, 10, 13, 0.84);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.625rem;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateX(-50%) translateY(-4px);
      transition: opacity 0.2s, transform 0.2s;
      backdrop-filter: blur(8px);
    }

    #hex-tooltip.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #inc-fab {
      position: absolute;
      bottom: 28px;
      left: 30px;
      z-index: 1000;
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      gap: 8px;
      padding: 0 0 8px;
      border: 0;
      border-bottom: 1px solid var(--cyan);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    #inc-fab:hover {
      border-color: var(--ink);
      color: var(--cyan);
    }

    #inc-fab svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
    }

    #inc-dialog {
      position: absolute;
      bottom: 28px;
      left: 30px;
      z-index: 11000;
      display: none;
      width: min(360px, calc(100vw - 60px));
      overflow: hidden;
      border: 0;
      border-top: 1px solid var(--line-strong);
      border-left: 2px solid var(--cyan);
      border-radius: 0;
      background: rgba(7, 10, 13, 0.94);
      color: var(--ink);
      box-shadow: 18px 18px 50px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    #inc-dialog.show { display: block; }

    .dlg-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 16px 13px;
      border-bottom: 1px solid var(--line);
    }

    .dlg-head-title {
      color: var(--ink);
      font-size: 0.8125rem;
      font-weight: 600;
    }

    .dlg-close {
      width: 24px;
      height: 24px;
      font-size: 1.125rem;
      line-height: 1;
    }

    .dlg-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: calc(100dvh - 120px);
      padding: 15px 16px 17px;
      overflow-y: auto;
    }

    .dlg-status {
      min-height: 18px;
      padding: 4px 0 8px;
      color: var(--ink-dim);
      font-family: var(--mono);
      font-size: 0.6875rem;
      line-height: 1.45;
    }

    .dlg-status.ok { color: var(--success); }
    .dlg-status.err { color: var(--danger); }

    .dlg-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      color: var(--ink-faint);
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .dlg-field select,
    .dlg-field textarea,
    .dlg-field input {
      min-height: 40px;
      padding: 8px 0;
    }

    .dlg-field select option { background: #080b0e; }
    .dlg-field textarea { min-height: 80px; resize: vertical; }

    .dlg-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 3px;
    }

    .inc-section {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .inc-section.hidden { display: none; }

    @media (max-width: 960px) {
      .admin-screen-head { padding-inline: 22px; }
      .admin-screen-body {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 20px 22px 26px;
      }
    }

    @media (max-width: 760px) {
      #dock {
        top: 20px;
        right: 18px;
      }

      #panel {
        width: min(290px, 82vw);
        min-width: 0;
      }

      .panel-head { padding: 23px 21px 17px; }
      .panel-body { padding-inline: 21px; }

      #topbar {
        top: 20px;
        left: 18px;
        width: min(240px, calc(100vw - 36px));
      }

      .topbar-title { font-size: 1rem; }
      .leaflet-control-zoom { margin: 64px 18px 18px !important; }

      #map-legend {
        right: 18px;
        bottom: 20px;
      }

      #inc-fab {
        bottom: 20px;
        left: 18px;
      }

      #inc-dialog {
        right: 18px;
        bottom: 20px;
        left: 18px;
        width: auto;
        max-height: calc(100dvh - 40px);
      }

      .admin-screen-head { padding: 18px 18px 14px; }
      .admin-screen-body { padding: 18px 18px 22px; }
    }

    @media (max-width: 420px) {
      #panel { width: min(276px, 82vw); }
      #map-legend { width: 138px; }
      .admin-main .admin-list { grid-template-columns: 1fr; }
      .dlg-actions { flex-direction: column-reverse; }
      .dlg-actions > button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
<div id="shell">
  <nav id="dock" aria-label="主導覽">
    <div class="dock-logo" aria-hidden="true">
      <img src="logo.png" alt="" />
    </div>

    <button class="dock-btn" id="btnPanel" type="button" aria-label="圖層" aria-pressed="false">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/><rect x="14" y="17" width="7" height="4" rx="1"/>
      </svg>
      <span class="dock-tip">圖層</span>
    </button>

    <div class="dock-div"></div>

    <button class="dock-btn" id="btnReport" type="button" aria-label="回報事件" aria-pressed="false">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span class="dock-tip">回報事件</span>
    </button>

    <div class="dock-spacer"></div>
    <div class="dock-div"></div>

    <button class="dock-btn hidden" id="btnAdmin" type="button" aria-label="後台管理" aria-pressed="false">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/>
        <path d="M2 6h4"/>
        <path d="M2 10h4"/>
        <path d="M2 14h4"/>
        <path d="M2 18h4"/>
        <path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/>
      </svg>
      <span class="dock-tip">後台管理</span>
    </button>

    <button class="dock-btn" type="button" aria-label="設定" aria-pressed="false">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      <span class="dock-tip">設定</span>
    </button>

    <button class="dock-btn" id="btnLogout" type="button" aria-label="登出" disabled>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span class="dock-tip">登出</span>
    </button>
  </nav>

  <aside id="panel" class="closed" aria-label="圖層">
    <div class="panel-head">
      <div class="panel-head-copy">
        <div class="panel-head-title" id="panel-title">圖層</div>
      </div>
      <button class="panel-close" id="btn-panel-close" type="button" aria-label="收合圖層面板">收合</button>
    </div>
    <div class="panel-body" id="dashboard-panel">
      <details class="panel-insights">
        <summary class="panel-insights-title">
          <span>資料摘要</span>
          <span class="panel-insights-chevron" aria-hidden="true">⌄</span>
        </summary>
        <div class="panel-insights-content">
          <div class="stat-grid">
            <div class="stat-card">
              <div class="stat-label">回報事件</div>
              <div class="stat-val" id="stat-incident-count">0<span class="stat-unit">件</span></div>
            </div>
          </div>

          <div class="block">
            <div class="block-label">事件類型分佈</div>
            <div class="bar-row">
              <span class="bar-name">夜間事故</span>
              <div class="bar-track"><div class="bar-fill" id="bar-accident" style="width:0%;background:#F0997B;"></div></div>
              <span class="bar-num" id="bar-accident-num">0</span>
            </div>
            <div class="bar-row">
              <span class="bar-name">夜間騷擾</span>
              <div class="bar-track"><div class="bar-fill" id="bar-harassment" style="width:0%;background:#ef718d;"></div></div>
              <span class="bar-num" id="bar-harassment-num">0</span>
            </div>
          </div>
        </div>
      </details>


      <div class="block layer-block">
        <details class="layer-group" open>
          <summary class="layer-group-title">
            <span>亮度圖層</span>
            <span class="layer-group-chevron" aria-hidden="true">⌄</span>
          </summary>
          <div class="layer-group-content">
            <div class="layer-item">
              <div class="layer-left">
                <span class="layer-dot" style="background:#f3f6ff;"></span>
                <span class="layer-name">實測亮度</span>
              </div>
              <button class="tog" id="tog-brightness" type="button" aria-label="切換實測亮度圖層" aria-pressed="true"></button>
            </div>
            <div class="layer-item">
              <div class="layer-left">
                <span class="layer-dot" style="background:#D85A30;"></span>
                <span class="layer-name">安全事件</span>
              </div>
              <button class="tog" id="tog-incident" type="button" aria-label="切換安全事件圖層" aria-pressed="true"></button>
            </div>
          </div>
        </details>
        <details class="layer-group" open>
          <summary class="layer-group-title">
            <span>邊界</span>
            <span class="layer-group-chevron" aria-hidden="true">⌄</span>
          </summary>
          <div class="layer-group-content">
            <div class="layer-item">
              <div class="layer-left">
                <span class="layer-dot" style="background:#7bcfa1;"></span>
                <span class="layer-name">道路安全框線</span>
              </div>
              <button class="tog" id="tog-safety" type="button" aria-label="切換道路安全圖層" aria-pressed="true"></button>
            </div>
            <div class="layer-item">
              <div class="layer-left">
                <span class="layer-dot" style="background:#b79af5;"></span>
                <span class="layer-name">光害控制區</span>
              </div>
              <button class="tog" id="tog-protect" type="button" aria-label="切換光害控制區圖層" aria-pressed="true"></button>
            </div>
          </div>
        </details>
      </div>
    </div>
  </aside>

  <div id="map-wrap">
    <div id="topbar" role="banner" aria-label="地圖標題">
      <div class="topbar-title">台大夜間亮度地圖</div>
    </div>

    <div id="hex-tooltip" role="status" aria-live="polite"></div>
    <div id="map"></div>
    <aside id="map-legend" aria-label="亮度圖例">
      <div class="map-legend-title">
        <span>亮度</span>
        <span class="map-legend-unit">lux</span>
      </div>
      <div class="map-legend-row"><span class="map-legend-swatch" style="background:#0b1020;"></span><span>0 - 1</span></div>
      <div class="map-legend-row"><span class="map-legend-swatch" style="background:#1f2a5a;"></span><span>1 - 12</span></div>
      <div class="map-legend-row"><span class="map-legend-swatch" style="background:#2f6f9f;"></span><span>12 - 29</span></div>
      <div class="map-legend-row"><span class="map-legend-swatch" style="background:#6fd0c2;"></span><span>29 - 54</span></div>
      <div class="map-legend-row"><span class="map-legend-swatch" style="background:#f3f6ff;"></span><span>54 +</span></div>
    </aside>

    <section class="admin-screen hidden" id="admin-panel" aria-label="事件後台">
      <header class="admin-screen-head">
        <div>
          <div class="panel-head-title">事件後台</div>
          <div class="panel-head-sub">Incident Admin</div>
        </div>
        <div class="admin-status-log" id="admin-status" aria-live="polite">尚未載入</div>
        <button class="admin-close" id="btn-admin-close" type="button" aria-label="關閉事件後台">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </header>
      <div class="admin-screen-body">
        <section class="admin-section">
          <div class="admin-section-head">
            <div>
              <div class="admin-section-title">管理員</div>
              <div class="admin-section-sub">Admin Users</div>
            </div>
          </div>
          <div class="block">
            <div class="block-label">新增管理員</div>
            <div class="admin-form">
              <input class="admin-input" id="admin-email" type="email" placeholder="name@ntu.edu.tw" autocomplete="off"/>
              <button class="btn-pri" id="btn-admin-add" type="button">新增管理員</button>
            </div>
          </div>
          <div class="admin-list" id="admin-users-list"></div>
        </section>
        <section class="admin-section admin-main">
          <div class="admin-section-head">
            <div>
              <div class="admin-section-title">事件管理</div>
              <div class="admin-section-sub">Incident Review</div>
            </div>
          </div>
          <div class="admin-list" id="admin-incidents-list"></div>
        </section>
      </div>
    </section>

    <button id="inc-fab" type="button" aria-label="回報安全事件">
      <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      回報安全事件
    </button>

    <div id="inc-dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <div class="dlg-head">
        <span class="dlg-head-title" id="dlg-title">新增安全事件</span>
        <button class="dlg-close" id="dlg-close" type="button" aria-label="關閉">×</button>
      </div>
      <div class="dlg-body">
        <div class="inc-section" id="auth-section">
          <div class="dlg-status" id="auth-status">請使用 NTU email 驗證後回報</div>
          <div class="dlg-field">
            <label for="auth-email">NTU Email</label>
            <input id="auth-email" type="email" placeholder="name@ntu.edu.tw" autocomplete="email"/>
          </div>
          <div class="dlg-actions">
            <button class="btn-pri" id="btn-request-code" type="button">寄送驗證碼</button>
          </div>
          <div class="dlg-field">
            <label for="auth-code">驗證碼</label>
            <input id="auth-code" inputmode="numeric" maxlength="6" placeholder="6 位數字" autocomplete="one-time-code"/>
          </div>
          <div class="dlg-actions">
            <button class="btn-pri" id="btn-verify-code" type="button">驗證</button>
          </div>
        </div>

        <div class="inc-section hidden" id="report-section">
          <div class="dlg-status" id="report-status">請在地圖上點選回報區</div>
          <div class="dlg-field">
            <label for="inc-type">事件類型</label>
            <select id="inc-type" required>
              <option value="accident">夜間事故</option>
              <option value="harassment">夜間騷擾</option>
            </select>
          </div>
          <div class="dlg-field">
            <label for="inc-desc">描述</label>
            <textarea id="inc-desc" maxlength="300" required placeholder="請描述事件情況..."></textarea>
          </div>
          <div class="dlg-actions">
            <button class="btn-sec" id="btn-cancel" type="button">取消</button>
            <button class="btn-pri" id="btn-submit" type="button" disabled>送出</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const map = L.map('map', { zoomControl: false }).setView([25.0173, 121.5398], 16);

map.createPane('brightnessPane'); map.getPane('brightnessPane').style.zIndex = 350;
map.createPane('safetyPane');     map.getPane('safetyPane').style.zIndex = 300;
map.createPane('protectPane');    map.getPane('protectPane').style.zIndex = 250;
map.createPane('incidentPane');   map.getPane('incidentPane').style.zIndex = 400;

const ASSET_BASE = location.pathname.startsWith('/ntu_light_map/') ? '/ntu_light_map' : '';
const assetUrl = path => `${ASSET_BASE}${path}`;

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

const panel = document.getElementById('panel');
const btnPanel = document.getElementById('btnPanel');
const btnReport = document.getElementById('btnReport');
const btnLogout = document.getElementById('btnLogout');
const btnAdmin = document.getElementById('btnAdmin');
const panelTitle = document.getElementById('panel-title');
const dashboardPanel = document.getElementById('dashboard-panel');
const adminPanel = document.getElementById('admin-panel');
const adminStatus = document.getElementById('admin-status');
const adminUsersList = document.getElementById('admin-users-list');
const adminIncidentsList = document.getElementById('admin-incidents-list');
const adminEmail = document.getElementById('admin-email');
const btnAdminAdd = document.getElementById('btn-admin-add');
const btnAdminClose = document.getElementById('btn-admin-close');
const btnPanelClose = document.getElementById('btn-panel-close');

function syncPanelButtonState(open) {
  btnPanel.classList.toggle('active', open);
  btnPanel.setAttribute('aria-pressed', String(open));
}

btnPanel.addEventListener('click', () => {
  if (!adminPanel.classList.contains('hidden')) {
    showDashboardPanel();
    return;
  }

  if (dashboardPanel.classList.contains('hidden')) {
    showDashboardPanel();
    return;
  }

  const closed = panel.classList.toggle('closed');
  syncPanelButtonState(!closed);
  window.setTimeout(() => map.invalidateSize(), 280);
});
btnPanelClose.addEventListener('click', () => {
  panel.classList.add('closed');
  syncPanelButtonState(false);
  window.setTimeout(() => map.invalidateSize(), 280);
});

const layerMap = {};

function makeToggle(id, layerKey) {
  const btn = document.getElementById(id);
  btn.addEventListener('click', () => {
    btn.classList.toggle('off');
    btn.setAttribute('aria-pressed', String(!btn.classList.contains('off')));
    const layer = layerMap[layerKey];
    if (!layer) return;
    if (btn.classList.contains('off')) map.removeLayer(layer);
    else layer.addTo(map);
  });
}

makeToggle('tog-brightness', 'brightness');
makeToggle('tog-safety', 'safety');
makeToggle('tog-incident', 'incident');
makeToggle('tog-protect', 'protect');

const incidentTypeMeta = {
  accident: { label: '夜間事故', color: '#F0997B' },
  harassment: { label: '夜間騷擾', color: '#ef718d' }
};

const incidentHexLayer = L.layerGroup().addTo(map);
layerMap.incident = incidentHexLayer;

let authSession = null;
let reportHexLayer = null;
let selectedHexLayer = null;
let selectedHex = null;
let allIncidents = [];
let allAdminIncidents = [];
let allAdminUsers = [];
const reportHexFeatureById = new Map();

const incFab = document.getElementById('inc-fab');
const incDialog = document.getElementById('inc-dialog');
const dlgClose = document.getElementById('dlg-close');
const authSec = document.getElementById('auth-section');
const reportSec = document.getElementById('report-section');
const authStatus = document.getElementById('auth-status');
const reportStatus = document.getElementById('report-status');
const authEmail = document.getElementById('auth-email');
const authCode = document.getElementById('auth-code');
const btnRequestCode = document.getElementById('btn-request-code');
const btnVerifyCode = document.getElementById('btn-verify-code');
const incType = document.getElementById('inc-type');
const incDesc = document.getElementById('inc-desc');
const btnSubmit = document.getElementById('btn-submit');
const btnCancel = document.getElementById('btn-cancel');
const hexTooltip = document.getElementById('hex-tooltip');
const mapLegend = document.getElementById('map-legend');

btnReport.addEventListener('click', () => {
  const active = !btnReport.classList.contains('active');
  btnReport.classList.toggle('active', active);
  btnReport.setAttribute('aria-pressed', String(active));
  beginIncidentFlow();
});

btnAdmin.addEventListener('click', () => {
  if (!adminPanel.classList.contains('hidden')) {
    showDashboardPanel();
    return;
  }

  showAdminPanel();
});

btnAdminClose.addEventListener('click', showDashboardPanel);

btnAdminAdd.addEventListener('click', () => {
  createAdminUser();
});

function setStatus(el, message, state = '') {
  el.textContent = message;
  el.className = `dlg-status ${state}`.trim();
}

function setAuthSession(session) {
  authSession = session?.authenticated ? session : null;
  btnLogout.disabled = !authSession;
  setAdminButtonVisible(Boolean(authSession?.admin));
  if (!authSession?.admin && !adminPanel.classList.contains('hidden')) showDashboardPanel();
}

function setAdminStatus(message) {
  adminStatus.textContent = message;
}

function setAdminButtonVisible(visible) {
  btnAdmin.classList.toggle('hidden', !visible);
}

function showDashboardPanel() {
  panel.classList.remove('closed');
  dashboardPanel.classList.remove('hidden');
  adminPanel.classList.add('hidden');
  syncPanelButtonState(true);
  btnAdmin.classList.remove('active');
  btnAdmin.setAttribute('aria-pressed', 'false');
  panelTitle.textContent = '圖層';
  window.setTimeout(() => map.invalidateSize(), 280);
}

async function showAdminPanel() {
  authSession = authSession || await getAuthSession();
  if (!authSession?.admin) {
    setAuthSession(authSession);
    showDashboardPanel();
    return;
  }

  if (incDialog.classList.contains('show')) closeDialog();
  panel.classList.remove('closed');
  dashboardPanel.classList.remove('hidden');
  adminPanel.classList.remove('hidden');
  syncPanelButtonState(true);
  btnAdmin.classList.add('active');
  btnAdmin.setAttribute('aria-pressed', 'true');
  panelTitle.textContent = '圖層';
  window.setTimeout(() => map.invalidateSize(), 280);

  if (allAdminIncidents.length === 0 && allAdminUsers.length === 0) {
    await loadAdminData();
  }
}

function showAuth() {
  authSec.classList.remove('hidden');
  reportSec.classList.add('hidden');
  if (reportHexLayer && map.hasLayer(reportHexLayer)) map.removeLayer(reportHexLayer);
}

function showReport() {
  authSec.classList.add('hidden');
  reportSec.classList.remove('hidden');
  if (reportHexLayer && !map.hasLayer(reportHexLayer)) reportHexLayer.addTo(map);
}

function closeDialog() {
  incDialog.classList.remove('show');
  mapLegend.classList.remove('hidden');
  btnReport.classList.remove('active');
  btnReport.setAttribute('aria-pressed', 'false');
  authSec.classList.remove('hidden');
  reportSec.classList.add('hidden');
  selectedHex = null;
  incDesc.value = '';
  authCode.value = '';
  btnSubmit.disabled = true;
  setStatus(reportStatus, '請在地圖上點選回報區');
  if (selectedHexLayer) {
    selectedHexLayer.remove();
    selectedHexLayer = null;
  }
  if (reportHexLayer && map.hasLayer(reportHexLayer)) map.removeLayer(reportHexLayer);
}

function updateSubmitState() {
  btnSubmit.disabled = !selectedHex || incDesc.value.trim().length === 0;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function incidentLabel(type) {
  return incidentTypeMeta[type]?.label || incidentTypeMeta.accident.label;
}

function incidentColor(type) {
  return incidentTypeMeta[type]?.color || incidentTypeMeta.accident.color;
}

function incidentStatusLabel(status) {
  return status === 'hidden' ? '已封存' : '公開';
}

function updateStatsPanel() {
  const total = allIncidents.length;
  const accidentCount = allIncidents.filter(incident => incident.type === 'accident').length;
  const harassmentCount = allIncidents.filter(incident => incident.type === 'harassment').length;
  const maxCount = Math.max(accidentCount, harassmentCount, 1);

  document.getElementById('stat-incident-count').innerHTML =
    `${total}<span class="stat-unit">件</span>`;
  document.getElementById('bar-accident').style.width =
    `${Math.round(accidentCount / maxCount * 100)}%`;
  document.getElementById('bar-accident-num').textContent = accidentCount;
  document.getElementById('bar-harassment').style.width =
    `${Math.round(harassmentCount / maxCount * 100)}%`;
  document.getElementById('bar-harassment-num').textContent = harassmentCount;
}

function renderAdminIncidentList() {
  if (allAdminIncidents.length === 0) {
    adminIncidentsList.innerHTML = '<div class="admin-status">目前沒有事件</div>';
    return;
  }

  adminIncidentsList.innerHTML = allAdminIncidents.map(incident => {
    const isHidden = incident.status === 'hidden';
    const nextStatus = isHidden ? 'public' : 'hidden';
    const actionLabel = isHidden ? '恢復' : '封存';
    const actionClass = isHidden ? 'btn-restore' : 'btn-danger';
    return `
      <article class="admin-item ${isHidden ? 'hidden-incident' : ''}" data-incident-id="${escapeHtml(incident.id)}">
        <div class="admin-item-head">
          <div class="admin-item-title">${escapeHtml(incidentLabel(incident.type))} · #${escapeHtml(incident.id)}</div>
          <span class="admin-badge ${escapeHtml(incident.status)}">${incidentStatusLabel(incident.status)}</span>
        </div>
        <div class="admin-desc">${escapeHtml(incident.description)}</div>
        <div class="admin-meta">區域 ${escapeHtml(incident.report_hex_id)} · ${escapeHtml(incident.created_at)}</div>
        <div class="admin-actions">
          <button class="${actionClass}" data-incident-status="${nextStatus}">${actionLabel}</button>
        </div>
      </article>
    `;
  }).join('');
}

function renderAdminUserList() {
  if (allAdminUsers.length === 0) {
    adminUsersList.innerHTML = '<div class="admin-status">目前沒有管理員</div>';
    return;
  }

  adminUsersList.innerHTML = allAdminUsers.map(user => `
    <article class="admin-item" data-admin-email="${escapeHtml(user.email)}">
      <div class="admin-item-head">
        <div class="admin-item-title">${escapeHtml(user.email)}</div>
        <span class="admin-badge admin-role">admin</span>
      </div>
      <div class="admin-meta">新增者 ${escapeHtml(user.created_by || '-')} · ${escapeHtml(user.created_at)}</div>
      <div class="admin-actions">
        <button class="btn-danger" data-delete-admin="${escapeHtml(user.email)}">刪除</button>
      </div>
    </article>
  `).join('');
}

function renderIncidents() {
  incidentHexLayer.clearLayers();
  const grouped = new Map();

  allIncidents.forEach(incident => {
    const key = Number(incident.report_hex_id);
    if (!Number.isInteger(key)) return;
    const list = grouped.get(key) || [];
    list.push(incident);
    grouped.set(key, list);
  });

  grouped.forEach((incidents, reportHexId) => {
    const feature = reportHexFeatureById.get(reportHexId);
    if (!feature) return;

    const latest = incidents[0];
    const color = incidentColor(latest.type);
    const rows = incidents.slice(0, 5).map(incident => `
      <div style="border-top:1px solid rgba(15,23,42,.12); padding-top:5px; margin-top:5px;">
        <b>${escapeHtml(incidentLabel(incident.type))}</b><br/>
        ${escapeHtml(incident.description)}<br/>
        <span style="color:#64748b;">${escapeHtml(incident.created_at)}</span>
      </div>
    `).join('');

    const layer = L.geoJSON(feature, {
      pane: 'incidentPane',
      style: {
        color,
        weight: 1.4,
        opacity: 0.95,
        fillColor: color,
        fillOpacity: Math.min(0.62, 0.28 + incidents.length * 0.08)
      }
    });

    layer.bindPopup(`
      <div style="font:12px/1.5 system-ui,sans-serif; min-width:180px;">
        <b>回報區 ${reportHexId}</b><br/>
        回報數：${incidents.length}
        ${rows}
      </div>
    `);
    incidentHexLayer.addLayer(layer);
  });

  updateStatsPanel();
}

function selectReportHex(feature, layer) {
  const id = Number(feature.properties?.id);
  if (!Number.isInteger(id)) return;

  selectedHex = { id, center: layer.getBounds().getCenter(), feature };
  if (selectedHexLayer) selectedHexLayer.remove();

  selectedHexLayer = L.geoJSON(feature, {
    pane: 'incidentPane',
    interactive: false,
    style: {
      color: '#F0997B',
      weight: 2.5,
      opacity: 1,
      fillColor: '#D85A30',
      fillOpacity: 0.35
    }
  }).addTo(map);

  setStatus(reportStatus, `已選回報區 ${id}`, 'ok');
  updateSubmitState();
}

async function loadJSON(url) {
  const response = await fetch(url);
  return response.json();
}

async function loadIncidents() {
  const response = await fetch('/api/incidents', { headers: { accept: 'application/json' } });
  if (!response.ok) return;
  const data = await response.json();
  allIncidents = Array.isArray(data.incidents) ? data.incidents : [];
  renderIncidents();
}

async function loadAdminData() {
  setAdminStatus('載入中');

  try {
    const [incidentsResponse, usersResponse] = await Promise.all([
      fetch('/api/admin/incidents', { headers: { accept: 'application/json' } }),
      fetch('/api/admin/users', { headers: { accept: 'application/json' } })
    ]);

    if (
      incidentsResponse.status === 401 ||
      incidentsResponse.status === 403 ||
      usersResponse.status === 401 ||
      usersResponse.status === 403
    ) {
      setAuthSession(null);
      showDashboardPanel();
      return;
    }
    if (!incidentsResponse.ok || !usersResponse.ok) {
      setAdminStatus('載入失敗');
      return;
    }

    const incidentsData = await incidentsResponse.json();
    const usersData = await usersResponse.json();
    allAdminIncidents = Array.isArray(incidentsData.incidents) ? incidentsData.incidents : [];
    allAdminUsers = Array.isArray(usersData.admins) ? usersData.admins : [];
    renderAdminIncidentList();
    renderAdminUserList();
    setAdminStatus('載入完成');
  } catch {
    setAdminStatus('載入失敗');
  }
}

async function createAdminUser() {
  const email = adminEmail.value.trim().toLowerCase();
  if (!email.endsWith('@ntu.edu.tw')) {
    setAdminStatus('請輸入 @ntu.edu.tw email');
    return;
  }

  btnAdminAdd.disabled = true;
  setAdminStatus('新增管理員中');

  try {
    const response = await fetch('/api/admin/users', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        accept: 'application/json'
      },
      body: JSON.stringify({ email })
    });

    if (response.status === 401 || response.status === 403) {
      setAuthSession(null);
      showDashboardPanel();
      return;
    }
    if (!response.ok) {
      setAdminStatus('新增管理員失敗');
      return;
    }

    const data = await response.json();
    allAdminUsers = [
      data.admin,
      ...allAdminUsers.filter(user => user.email !== data.admin.email)
    ];
    adminEmail.value = '';
    renderAdminUserList();
    setAdminStatus('管理員已新增');
  } catch {
    setAdminStatus('新增管理員失敗');
  } finally {
    btnAdminAdd.disabled = false;
  }
}

async function loadReportHexes() {
  const geo = await loadJSON(assetUrl('/data/report_hex_4326.geojson'));
  geo.features.forEach(feature => {
    const id = Number(feature.properties?.id);
    if (Number.isInteger(id)) reportHexFeatureById.set(id, feature);
  });

  reportHexLayer = L.geoJSON(geo, {
    pane: 'incidentPane',
    style: {
      color: '#cbd5e1',
      weight: 0.55,
      opacity: 0.28,
      fillColor: '#cbd5e1',
      fillOpacity: 0.01
    },
    onEachFeature: (feature, layer) => {
      layer.on('click', () => selectReportHex(feature, layer));
      layer.on('mouseover', () => layer.setStyle({ opacity: 0.7, fillOpacity: 0.08, weight: 1 }));
      layer.on('mouseout', () => layer.setStyle({ opacity: 0.28, fillOpacity: 0.01, weight: 0.55 }));
    }
  });

  if (
    incDialog.classList.contains('show') &&
    !reportSec.classList.contains('hidden') &&
    !map.hasLayer(reportHexLayer)
  ) {
    reportHexLayer.addTo(map);
  }

  await loadIncidents();
}

async function getAuthSession() {
  try {
    const response = await fetch('/api/protected/session', {
      headers: { accept: 'application/json' }
    });
    if (!response.ok) return null;
    return response.json();
  } catch {
    return null;
  }
}

async function refreshAuthSession() {
  setAuthSession(await getAuthSession());
}

async function beginIncidentFlow() {
  if (!adminPanel.classList.contains('hidden')) showDashboardPanel();
  if (window.matchMedia('(max-width: 760px)').matches) {
    panel.classList.add('closed');
    syncPanelButtonState(false);
    window.setTimeout(() => map.invalidateSize(), 280);
  }

  if (incDialog.classList.contains('show')) {
    closeDialog();
    return;
  }
  if (!authSession) await refreshAuthSession();
  incDialog.classList.add('show');
  mapLegend.classList.add('hidden');
  btnReport.classList.add('active');
  btnReport.setAttribute('aria-pressed', 'true');
  if (authSession?.authenticated) showReport();
  else showAuth();
}

incFab.addEventListener('click', beginIncidentFlow);
dlgClose.addEventListener('click', closeDialog);
btnCancel.addEventListener('click', closeDialog);
incDesc.addEventListener('input', updateSubmitState);

btnLogout.addEventListener('click', async () => {
  if (btnLogout.disabled) return;
  const previousSession = authSession;
  btnLogout.disabled = true;

  try {
    const response = await fetch('/api/auth/logout', {
      method: 'POST',
      headers: { accept: 'application/json' }
    });
    if (!response.ok) throw new Error('logout_failed');

    setAuthSession(null);
    closeDialog();
    setStatus(authStatus, '已登出，請重新登入');
  } catch {
    setAuthSession(previousSession);
    if (!incDialog.classList.contains('show')) {
      incDialog.classList.add('show');
      mapLegend.classList.add('hidden');
      btnReport.classList.add('active');
      btnReport.setAttribute('aria-pressed', 'true');
    }
    showReport();
    setStatus(reportStatus, '登出失敗，請稍後再試', 'err');
  }
});

btnRequestCode.addEventListener('click', async () => {
  const email = authEmail.value.trim().toLowerCase();
  if (!email.endsWith('@ntu.edu.tw')) {
    setStatus(authStatus, '請輸入 @ntu.edu.tw email', 'err');
    return;
  }

  btnRequestCode.disabled = true;
  setStatus(authStatus, '寄送中');

  try {
    const response = await fetch('/api/auth/request-code', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        accept: 'application/json'
      },
      body: JSON.stringify({ email })
    });

    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      setStatus(authStatus, errorData.message || errorData.error || '寄送失敗', 'err');
      return;
    }

    setStatus(authStatus, '驗證碼已寄出，請檢查信箱', 'ok');
    authCode.focus();
  } catch {
    setStatus(authStatus, '寄送失敗', 'err');
  } finally {
    btnRequestCode.disabled = false;
  }
});

btnVerifyCode.addEventListener('click', async () => {
  const email = authEmail.value.trim().toLowerCase();
  const code = authCode.value.trim();
  if (!email.endsWith('@ntu.edu.tw') || !/^\d{6}$/.test(code)) {
    setStatus(authStatus, '請輸入 NTU email 與 6 位數驗證碼', 'err');
    return;
  }

  btnVerifyCode.disabled = true;
  setStatus(authStatus, '驗證中');

  try {
    const response = await fetch('/api/auth/verify-code', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        accept: 'application/json'
      },
      body: JSON.stringify({ email, code })
    });

    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      setStatus(authStatus, errorData.message || errorData.error || '驗證失敗', 'err');
      return;
    }

    setAuthSession(await response.json());
    setStatus(authStatus, '驗證完成', 'ok');
    showReport();
    setStatus(reportStatus, '請在地圖上點選回報區');
  } catch {
    setStatus(authStatus, '驗證失敗', 'err');
  } finally {
    btnVerifyCode.disabled = false;
  }
});

adminIncidentsList.addEventListener('click', async event => {
  const button = event.target.closest('[data-incident-status]');
  if (!button) return;

  const item = button.closest('[data-incident-id]');
  const id = Number(item?.dataset.incidentId);
  const nextStatus = button.dataset.incidentStatus;
  if (!Number.isInteger(id)) return;
  if (nextStatus !== 'public' && nextStatus !== 'hidden') return;

  const isRestoring = nextStatus === 'public';
  const actionLabel = isRestoring ? '恢復' : '封存';

  button.disabled = true;
  setAdminStatus(`${actionLabel}中`);

  try {
    const response = await fetch(`/api/admin/incidents/${id}`, {
      method: 'PATCH',
      headers: {
        'content-type': 'application/json',
        accept: 'application/json'
      },
      body: JSON.stringify({ status: nextStatus })
    });

    if (response.status === 401 || response.status === 403) {
      setAuthSession(null);
      showDashboardPanel();
      return;
    }
    if (!response.ok) {
      setAdminStatus(`${actionLabel}失敗`);
      button.disabled = false;
      return;
    }

    const data = await response.json();
    allAdminIncidents = allAdminIncidents.map(incident =>
      Number(incident.id) === id ? data.incident : incident
    );
    if (isRestoring) {
      allIncidents = [
        data.incident,
        ...allIncidents.filter(incident => Number(incident.id) !== id)
      ].sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
    } else {
      allIncidents = allIncidents.filter(incident => Number(incident.id) !== id);
    }
    renderAdminIncidentList();
    renderIncidents();
    setAdminStatus(`${actionLabel}完成`);
  } catch {
    setAdminStatus(`${actionLabel}失敗`);
    button.disabled = false;
  }
});

adminUsersList.addEventListener('click', async event => {
  const button = event.target.closest('[data-delete-admin]');
  if (!button) return;

  const email = button.dataset.deleteAdmin;
  if (!email) return;
  if (!window.confirm(`確定刪除管理員 ${email}？`)) return;

  button.disabled = true;
  setAdminStatus('刪除管理員中');

  try {
    const response = await fetch(`/api/admin/users/${encodeURIComponent(email)}`, {
      method: 'DELETE',
      headers: { accept: 'application/json' }
    });

    if (response.status === 401 || response.status === 403) {
      setAuthSession(null);
      showDashboardPanel();
      return;
    }
    if (response.status === 409) {
      setAdminStatus('不能刪除最後一位管理員');
      button.disabled = false;
      return;
    }
    if (!response.ok) {
      setAdminStatus('刪除管理員失敗');
      button.disabled = false;
      return;
    }

    allAdminUsers = allAdminUsers.filter(user => user.email !== email);
    renderAdminUserList();
    setAdminStatus('管理員已刪除');
  } catch {
    setAdminStatus('刪除管理員失敗');
    button.disabled = false;
  }
});

btnSubmit.addEventListener('click', async () => {
  if (reportSec.classList.contains('hidden')) return;
  if (!selectedHex) {
    setStatus(reportStatus, '請先點選回報區', 'err');
    return;
  }

  btnSubmit.disabled = true;
  setStatus(reportStatus, '送出中');

  try {
    const response = await fetch('/api/protected/incidents', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        accept: 'application/json'
      },
      body: JSON.stringify({
        report_hex_id: selectedHex.id,
        lat: selectedHex.center.lat,
        lng: selectedHex.center.lng,
        type: incType.value,
        description: incDesc.value.trim()
      })
    });

    if (response.status === 401 || response.status === 403) {
      setAuthSession(null);
      showAuth();
      setStatus(authStatus, '請先完成 NTU email 驗證', 'err');
      return;
    }
    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      setStatus(reportStatus, errorData.message || errorData.error || '送出失敗', 'err');
      updateSubmitState();
      return;
    }

    const data = await response.json();
    if (data.incident) {
      allIncidents.unshift(data.incident);
      renderIncidents();
    }
    closeDialog();
  } catch {
    setStatus(reportStatus, '送出失敗', 'err');
    updateSubmitState();
  }
});

refreshAuthSession();

fetch(assetUrl('/data/ntu_area.geojson'))
  .then(response => response.json())
  .then(geo => {
    const ntuLine = L.geoJSON(geo, {
      style: { color: '#eef2f7', weight: 1.05, opacity: 0.9 }
    }).addTo(map);
    map.fitBounds(ntuLine.getBounds());
  });

(async () => {
  const geoBrightness = await loadJSON(assetUrl('/data/merge_sur_zhoushan.geojson'));
  const rawVals = geoBrightness.features
    .map(feature => Number(feature.properties?.brightness_filled))
    .filter(value => Number.isFinite(value) && value >= 0);

  if (!rawVals.length) return;

  const ramp = ['#0b1020', '#1f2a5a', '#2f6f9f', '#6fd0c2', '#f3f6ff'];
  const getColor = value => !Number.isFinite(value)
    ? '#7b8492'
    : value <= 1 ? ramp[0]
    : value <= 12 ? ramp[1]
    : value <= 29 ? ramp[2]
    : value <= 54 ? ramp[3]
    : ramp[4];

  const brightLayer = L.geoJSON(geoBrightness, {
    pane: 'brightnessPane',
    style: feature => ({
      color: 'rgba(6,10,18,.55)',
      weight: 0.25,
      fillColor: getColor(Number(feature.properties?.brightness_filled)),
      fillOpacity: 0.9
    }),
    onEachFeature: (feature, layer) => {
      const value = Number(feature.properties?.brightness_filled);
      const id = feature.properties?.id ?? '-';
      layer.on('mouseover', () => {
        hexTooltip.textContent = `Hex ${id}  ·  ${Number.isFinite(value) ? value.toFixed(2) : 'N/A'} lux`;
        hexTooltip.classList.add('show');
      });
      layer.on('mouseout', () => hexTooltip.classList.remove('show'));
      layer.bindPopup(`<div style="font:12px/1.5 system-ui;min-width:120px;"><b style="font-size:13px">Hex ${escapeHtml(String(id))}</b><br><span style="background:#f1f5fb;padding:3px 6px;border-radius:5px;display:inline-block;margin-top:4px;">${Number.isFinite(value) ? value.toFixed(2) : 'N/A'} lux</span></div>`);
    }
  }).addTo(map);
  layerMap.brightness = brightLayer;

  const geoSafety = await loadJSON(assetUrl('/data/hex_hit_with_safe.geojson'));
  const safeColor = score => score === 1 ? '#7bcfa1' : score === 2 ? '#e6c07a' : score === 3 ? '#e08a8a' : '#8aa2d6';
  const safetyLayer = L.geoJSON(geoSafety, {
    pane: 'safetyPane',
    style: feature => ({
      color: safeColor(Number(feature.properties?.safe_worst)),
      weight: 1.05,
      opacity: 0.9,
      fillOpacity: 0,
      fill: false
    }),
    onEachFeature: (feature, layer) => {
      const id = feature.properties?.id ?? '-';
      layer.bindPopup(`<div style="font:12px/1.5 system-ui;"><b>Hex ${escapeHtml(String(id))}</b><br>safe_worst: ${feature.properties?.safe_worst}<br>safe_mean: ${feature.properties?.safe_mean != null ? Number(feature.properties.safe_mean).toFixed(2) : 'N/A'}</div>`);
    }
  }).addTo(map);
  layerMap.safety = safetyLayer;

  const geoProtect = await loadJSON(assetUrl('/data/protect_square_4326.geojson'));
  const protectLayer = L.geoJSON(geoProtect, {
    pane: 'protectPane',
    style: { color: '#b79af5', fillColor: '#b79af5', fillOpacity: 0.18, weight: 0 }
  }).addTo(map);
  layerMap.protect = protectLayer;

  await loadReportHexes();

  if (window.location.hash === '#new-incident') {
    history.replaceState(null, '', location.pathname + location.search);
    beginIncidentFlow();
  }
})();
</script>
